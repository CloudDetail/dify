    - data:
        code: "import json\nimport re\n\ndef _extract_json(text: str) -> str:\n  \
          \  raw = (text or \"\").strip()\n    if not raw:\n        raise ValueError(\"\
          empty input\")\n\n    # 先兼容 ```json ... ``` 包裹\n    match = re.search(r\"\
          ```(?:json)?\\s*(.*?)\\s*```\", raw, re.DOTALL | re.IGNORECASE)\n    if\
          \ match:\n        raw = match.group(1).strip()\n\n    # 去掉模型推理标签\n    raw\
          \ = re.sub(r\"<think>.*?</think>\", \"\", raw, flags=re.DOTALL | re.IGNORECASE).strip()\n\
          \n    # 从文本中扫描首个可解析的完整 JSON\n    decoder = json.JSONDecoder()\n    for i,\
          \ ch in enumerate(raw):\n        if ch not in \"{[\":\n            continue\n\
          \        try:\n            obj, end = decoder.raw_decode(raw, i)\n     \
          \       return json.dumps(obj, ensure_ascii=False)\n        except json.JSONDecodeError:\n\
          \            continue\n\n    raise ValueError(\"no valid JSON object or\
          \ array found in input\")\n\ndef main(raw_data: str) -> dict:\n    rootcause\
          \ = json.loads(_extract_json(raw_data))\n    return {\n        \"result\"\
          : json.dumps(rootcause, ensure_ascii=False),\n    }"

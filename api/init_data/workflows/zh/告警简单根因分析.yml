    - data:
        code: "import json\nfrom collections import defaultdict\n\n\ndef _load(data_json):\n\
          \    try:\n        data = json.loads(data_json)\n    except (TypeError,\
          \ json.JSONDecodeError):\n        return []\n    return data if isinstance(data,\
          \ list) else []\n\n\ndef _target_identity(item, unknown_index):\n    labels\
          \ = item.get(\"labels\", {}) or {}\n    for key in (\"dst_pod\", \"dst_ip\"\
          ):\n        value = str(labels.get(key, \"\") or \"\").strip()\n       \
          \ if value:\n            return value, True\n    legend = str(item.get(\"\
          legend\", \"\") or \"\").strip()\n    if legend:\n        return legend,\
          \ True\n    return f\"unknown_dst_instance_{unknown_index}\", False\n\n\n\
          def main(data_json):\n    data = _load(data_json)\n    if not data:\n  \
          \      return {\n            \"result\": \"未检测到可用于归因的 RTT 异常数据，需要通过调用链补充分析。\"\
          ,\n            \"direction_summary\": \"未明确归因\",\n            \"abnormal_downstream_instances\"\
          : \"[]\",\n            \"evidence_quality\": \"insufficient\",\n       \
          \     \"requires_span_fallback\": \"true\",\n        }\n\n    first_labels\
          \ = data[0].get(\"labels\", {}) or {}\n    src_pod = first_labels.get(\"\
          src_pod\") or first_labels.get(\"pod\") or \"当前实例\"\n    src_node = first_labels.get(\"\
          src_node\") or first_labels.get(\"node\") or \"\"\n    src_ip = first_labels.get(\"\
          src_ip\") or \"\"\n    instances = []\n    details_by_node = defaultdict(list)\n\
          \    valid_count = 0\n    complete_count = 0\n    seen = set()\n\n    for\
          \ index, item in enumerate(data, start=1):\n        labels = item.get(\"\
          labels\", {}) or {}\n        identity, is_valid = _target_identity(item,\
          \ index)\n        if not is_valid or identity in seen:\n            continue\n\
          \        seen.add(identity)\n        valid_count += 1\n        dst_node\
          \ = str(labels.get(\"dst_node\", \"\") or \"\").strip()\n        dst_ip\
          \ = str(labels.get(\"dst_ip\", \"\") or \"\").strip()\n        if dst_node\
          \ and dst_ip:\n            complete_count += 1\n        avg = item.get(\"\
          avg\")\n        unit = item.get(\"unit\", \"\")\n        spike = item.get(\"\
          spike\")\n        instance = {\n            \"instance_name\": identity,\n\
          \            \"rtt_avg\": f\"{avg}{unit}\",\n            \"rtt_spike\":\
          \ f\"{spike}{unit}\",\n            \"node\": dst_node,\n            \"ip\"\
          : dst_ip,\n            \"evidence_quality\": \"complete\" if dst_node and\
          \ dst_ip else \"partial\",\n        }\n        instances.append(instance)\n\
          \        if dst_node:\n            details_by_node[dst_node].append(instance)\n\
          \n    if valid_count == 0:\n        return {\n            \"result\": \"\
          检测到 RTT 波动，但缺少可识别的下游目标，需要通过高耗时 Span 补充归因。\",\n            \"direction_summary\"\
          : \"未明确归因\",\n            \"abnormal_downstream_instances\": \"[]\",\n \
          \           \"evidence_quality\": \"insufficient\",\n            \"requires_span_fallback\"\
          : \"true\",\n        }\n\n    evidence_quality = \"complete\" if complete_count\
          \ == valid_count else \"partial\"\n    distinct_nodes = len(details_by_node)\n\
          \    dominant_node = None\n    for node, node_instances in details_by_node.items():\n\
          \        if len(node_instances) > 1 and len(node_instances) / valid_count\
          \ >= 0.7:\n            dominant_node = node\n            break\n\n    if\
          \ dominant_node:\n        direction = \"下游节点问题\"\n        result = f\"{src_pod}\
          \ 的 RTT 异常主要集中在下游节点 {dominant_node}，将结合高耗时 Span 补充具体调用证据。\"\n    elif distinct_nodes\
          \ >= 3 or valid_count >= 5:\n        direction = \"自身问题\"\n        location\
          \ = \" \".join(value for value in (src_node, src_ip) if value)\n       \
          \ result = f\"{src_pod} 与多个下游目标的 RTT 同时异常，倾向自身网络问题。{location}\".strip()\n\
          \    else:\n        direction = \"下游实例问题\"\n        names = \"、\".join(instance[\"\
          instance_name\"] for instance in instances)\n        result = f\"{src_pod}\
          \ 与下游实例 {names} 的 RTT 异常，将结合高耗时 Span 补充具体调用证据。\"\n\n    return {\n     \
          \   \"result\": result,\n        \"direction_summary\": direction,\n   \
          \     \"abnormal_downstream_instances\": json.dumps(instances),\n      \
          \  \"evidence_quality\": evidence_quality,\n        \"requires_span_fallback\"\
          : \"true\" if direction != \"自身问题\" or evidence_quality != \"complete\"\
          \ else \"false\",\n    }\n"
        code_language: python3

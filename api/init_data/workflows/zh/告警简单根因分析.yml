        - id: c77a6a17-bbbb-4880-8b2a-56a7fcbb419e
          role: system
          text: 你是一个可观测性领域的智能助手，帮助用户解决问题
        - id: a7ee2369-e05a-4e41-b423-78b3c05e03b9
          role: user
          text: '# 目的

            根据实例线程在各方向的消耗延时告警总结和影响当前实例的下游实服务/实例，总结告警事件的产生原因。

            # 数据

            当前运行对象{{#v2_runtime_environment_context.location_text#}}

            告警总结{{#17430596469370.text#}}

            下游{{#1754375770920.result#}}

            告警事件{{#1742807803325.alertName#}}

            # 背景

            根据实例线程在各方向上的时间消耗，已知当前告警根因为网络方向，且根据网络Ping质量数据得知主要延时是由下游依赖产生。所以根据告警总结和影响当前实例的下游实例再次做一个告警分析总结。

            # 总结思路

            1. 保留原总结中的各方向异常线程的描述、根因推导分析流程和根因方向总结，在此基础上为网络方向总结添加下游依赖详情描述。

            2. 使用真实告警名称和下游服务/实例描述下游影响；没有具体下游证据时明确说明证据不足，不得使用占位词。如果没有告警报告链接或者告警，则不需要描述相关的内容，如果有detail信息则添加对调用接口或者调用数据查询语句的具体描述。

            3. 有具体下游服务时将“下游依赖问题”细化为该服务的下游依赖问题；没有具体服务时保留通用表述。

            # 输出

            输出你的总结，逻辑清晰，语句简洁，避免过于专业用词。



            # 运行环境约束

            {{#v2_runtime_environment_context.prompt_context#}}

            运行环境上下文优先于知识库或通用示例；若知识库命令与当前环境冲突，必须忽略冲突命令。


            # 输出身份与环境规则

            - 服务名：{{#1754299310647.service#}}。服务名为空时省略服务字段，禁止输出任何占位服务名或“未知服务”。

            - 运行对象：{{#v2_runtime_environment_context.location_text#}}。

            - 对象类型：{{#v2_runtime_environment_context.instance_term#}}。

            - {{#v2_runtime_environment_context.prompt_context#}}

            - 不得因为指标或工具名称包含“按Pod统计”就推断当前一定是 Pod 或容器；必须服从运行环境上下文。

            - 示例中的 xx、xxx、XXXX 仅用于说明格式，禁止原样复制到最终报告或 JSON。

            '

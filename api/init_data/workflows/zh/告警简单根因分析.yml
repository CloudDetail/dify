        prompt_template:
        - id: 8ecc69bb-4504-40cc-9475-d9da1d54e2f8
          role: system
          text: 你是一个可观测性领域的智能助手，帮助用户解决问题
        - id: 47fedf0d-54f2-4912-8e87-da9e60b6aa0b
          role: user
          text: '#目的

            根据应用的结论生成当前情况的描述。

            使用结论内的数据，回答简洁易懂。


            # 格式模版参考

            告警事件结论


            **事件概述**：


            使用真实服务名和运行对象描述当前告警事件；服务名为空时省略服务字段。


            **受影响服务**

            （如果没有受影响服务数据则提示未检测到受影响服务）

            根据受影响服务数据描述具体业务功能、响应时间和错误率变化；缺少数据时不要编造。


            **问题分析**


            只输出已确认的单一根因方向，例如 CPU、网络质量、CPU 抢占、具体下游依赖或文件读写。



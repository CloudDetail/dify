    - data:
        code: "import json\n\n\ndef _loads(value):\n    if isinstance(value, dict):\n\
          \        return value\n    try:\n        return json.loads(value)\n    except\
          \ (TypeError, json.JSONDecodeError):\n        return {}\n\n\ndef _trace_items(value):\n\
          \    payload = _loads(value)\n    data = payload.get(\"data\", {}) if isinstance(payload,\
          \ dict) else {}\n    if isinstance(data, list):\n        return data\n \
          \   if isinstance(data, dict):\n        items = data.get(\"data\", data.get(\"\
          traces\", []))\n        return items if isinstance(items, list) else []\n\
          \    return []\n\n\ndef _attributes(span):\n    value = span.get(\"attributes\"\
          , {})\n    return value if isinstance(value, dict) else {}\n\n\ndef _normalize_span(span):\n\
          \    attributes = _attributes(span)\n    return {\n        \"spanId\": span.get(\"\
          spanId\", \"\"),\n        \"parentSpanId\": span.get(\"parentSpanId\", \"\
          \"),\n        \"service\": span.get(\"serviceName\", \"\"),\n        \"\
          operation\": span.get(\"name\", \"\"),\n        \"duration\": span.get(\"\
          duration\", 0) or 0,\n        \"error\": bool(span.get(\"error\") or span.get(\"\
          isError\") or span.get(\"status\") == \"error\"),\n        \"dbSystem\"\
          : attributes.get(\"db.system\", \"\"),\n        \"dbStatement\": str(attributes.get(\"\
          db.statement\", \"\") or \"\")[:240],\n        \"peerService\": span.get(\"\
          peerService\") or attributes.get(\"peer.service\") or \"\",\n    }\n\n\n\
          def _normalize_trace(trace):\n    spans = [span for span in trace.get(\"\
          spans\", []) if isinstance(span, dict)]\n    roots = [span for span in spans\
          \ if span.get(\"parentSpanId\") in (\"\", None, \"0\", 0)]\n    root = roots[0]\
          \ if roots else (spans[0] if spans else {})\n    dependencies = [span for\
          \ span in spans if span is not root]\n    slowest_source = dependencies\
          \ or spans\n    slowest = max(slowest_source, key=lambda item: item.get(\"\
          duration\", 0) or 0, default={})\n    errors = [\n        span\n       \
          \ for span in spans\n        if span.get(\"error\") or span.get(\"isError\"\
          ) or span.get(\"status\") == \"error\"\n    ]\n    error_span = max(errors,\
          \ key=lambda item: item.get(\"duration\", 0) or 0, default={})\n    duration\
          \ = trace.get(\"duration\", 0) or max(\n        (span.get(\"duration\",\

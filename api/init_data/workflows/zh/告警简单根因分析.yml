    - data:
        code: "import json\nimport math\n\n\nFALLBACK_US = 200000\n\n\ndef _fallback():\n\
          \    return {\"p90_value_us\": FALLBACK_US, \"threshold_source\": \"fallback\"\
          }\n\n\ndef main(data_json):\n    try:\n        data = json.loads(data_json).get(\"\
          data\", [])\n    except (TypeError, json.JSONDecodeError):\n        return\
          \ _fallback()\n\n    values = []\n    unit = \"\"\n    for item in data:\n\
          \        if item.get(\"title\") != \"Response Time\":\n            continue\n\
          \        item_unit = str(item.get(\"unit\", \"\") or \"\").lower().strip()\n\
          \        if not unit:\n            unit = item_unit\n        if item_unit\
          \ != unit:\n            continue\n        for timeseries in item.get(\"\
          timeseries\", []) or []:\n            chart = timeseries.get(\"chart\",\
          \ {}).get(\"chartData\", {}) or {}\n            for raw in chart.values():\n\
          \                if isinstance(raw, bool) or not isinstance(raw, (int, float)):\n\
          \                    continue\n                value = float(raw)\n    \
          \            if math.isfinite(value) and value > 0:\n                  \
          \  values.append(value)\n\n    if not values or unit not in {\"ms\", \"\
          s\", \"us\"}:\n        return _fallback()\n\n    values.sort()\n    index\
          \ = (len(values) - 1) * 0.9\n    lower = int(index)\n    upper = min(lower\
          \ + 1, len(values) - 1)\n    fraction = index - lower\n    p90 = values[lower]\
          \ * (1 - fraction) + values[upper] * fraction\n    multiplier = {\"us\"\
          : 1, \"ms\": 1000, \"s\": 1000000}[unit]\n    return {\n        \"p90_value_us\"\
          : round(p90 * multiplier),\n        \"threshold_source\": \"response_time_p90\"\
          ,\n    }\n"
        code_language: python3
        desc: ''
        outputs:
          p90_value_us:
            children: null
            type: number
          threshold_source:
            children: null
            type: string
        selected: false
        title: 计算延时P90数据
        type: code
        variables:
        - value_selector:
          - '1754462459105'
          - text
          variable: data_json

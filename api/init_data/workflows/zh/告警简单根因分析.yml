    - data:
        code: "import json\nimport math\nimport statistics\n\n\nABSOLUTE_THRESHOLD\
          \ = 0.05\nSPARSE_MIN_SPIKE = 0.02\nSPARSE_ZERO_RATIO = 0.5\nSPARSE_POSITIVE_RATIO\
          \ = 0.2\nROBUST_SIGMA_FACTOR = 3.0\nMIN_RELATIVE_INCREASE = 1.5\n\n\ndef\
          \ _valid_values(chart):\n    values = []\n    for raw in chart.values():\n\
          \        if isinstance(raw, bool) or not isinstance(raw, (int, float)):\n\
          \            continue\n        value = float(raw)\n        if math.isfinite(value)\
          \ and value >= 0:\n            values.append(value)\n    return values\n\
          \n\ndef _robust_baseline(positive):\n    if len(positive) < 3:\n       \
          \ return None\n    median = statistics.median(positive)\n    deviations\
          \ = [abs(value - median) for value in positive]\n    mad = statistics.median(deviations)\n\
          \    robust_sigma = 1.4826 * mad\n    if robust_sigma == 0:\n        robust_sigma\
          \ = statistics.pstdev(positive)\n    upper = median + ROBUST_SIGMA_FACTOR\
          \ * robust_sigma\n    return {\"median\": median, \"robust_sigma\": robust_sigma,\
          \ \"upper\": upper}\n\n\ndef analyze_data(result_str: str):\n    try:\n\
          \        data = json.loads(result_str)\n    except (TypeError, json.JSONDecodeError):\n\
          \        return json.dumps([])\n\n    timeseries = data.get(\"data\", {}).get(\"\
          timeseries\", []) or []\n    unit = data.get(\"unit\", \"\")\n    filtered\
          \ = []\n\n    for entry in timeseries:\n        labels = entry.get(\"labels\"\
          , {}) or {}\n        legend = str(entry.get(\"legend\", \"\") or \"\")\n\
          \        chart = entry.get(\"chart\", {}).get(\"chartData\", {}) or {}\n\
          \        values = _valid_values(chart)\n        if not values:\n       \
          \     continue\n\n        positive = [value for value in values if value\
          \ > 0]\n        if not positive:\n            continue\n\n        total_count\
          \ = len(values)\n        positive_count = len(positive)\n        zero_count\
          \ = total_count - positive_count\n        zero_ratio = zero_count / total_count\n\
          \        positive_ratio = positive_count / total_count\n        spike =\
          \ max(positive)\n        avg = sum(positive) / positive_count\n        reasons\
          \ = []\n        abnormal_values = set()\n\n        for index, value in enumerate(values):\n\
          \            if value > ABSOLUTE_THRESHOLD:\n                abnormal_values.add(index)\n\
          \        if abnormal_values:\n            reasons.append(\"absolute\")\n\
          \n        baseline = _robust_baseline(positive)\n        if baseline and\
          \ baseline[\"median\"] > 0:\n            robust_hits = {\n             \
          \   index\n                for index, value in enumerate(values)\n     \
          \           if value > baseline[\"upper\"] and value / baseline[\"median\"\
          ] >= MIN_RELATIVE_INCREASE\n            }\n            if robust_hits:\n\
          \                abnormal_values.update(robust_hits)\n                reasons.append(\"\
          robust_baseline\")\n\n        if (\n            zero_ratio >= SPARSE_ZERO_RATIO\n\
          \            and positive_ratio <= SPARSE_POSITIVE_RATIO\n            and\
          \ spike >= SPARSE_MIN_SPIKE\n        ):\n            reasons.append(\"sparse_spike\"\
          )\n            abnormal_values.update(index for index, value in enumerate(values)\
          \ if value == spike)\n\n        if not reasons:\n            continue\n\n\
          \        filtered.append({\n            \"chart\": chart,\n            \"\
          abnormalCount\": len(abnormal_values),\n            \"labels\": labels,\n\
          \            \"legend\": legend,\n            \"avg\": avg,\n          \
          \  \"unit\": unit,\n            \"spike\": spike,\n            \"zeroRatio\"\
          : zero_ratio,\n            \"positiveCount\": positive_count,\n        \
          \    \"detectionReasons\": reasons,\n            \"baseline\": baseline\
          \ or {},\n        })\n\n    return json.dumps(filtered)\n\n\ndef main(arg1:\
          \ str) -> dict:\n    return {\"result\": analyze_data(arg1)}\n"

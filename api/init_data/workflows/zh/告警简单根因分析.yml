    - data:
        code: "import json\n\n\ndef main(data_json: str, current_service: str):\n\
          \    try:\n        traces = json.loads(data_json).get(\"traces\", [])\n\
          \    except (TypeError, json.JSONDecodeError):\n        traces = []\n  \
          \  entries = []\n    seen = set()\n    trace_evidence = []\n    services\
          \ = {current_service} if current_service else set()\n\n    for trace in\
          \ traces:\n        entry = trace.get(\"entry\", {}) or {}\n        service\
          \ = str(entry.get(\"service\", \"\") or \"\").strip()\n        endpoint\
          \ = str(entry.get(\"endpoint\", \"\") or \"\").strip()\n        if service\
          \ and endpoint and (service, endpoint) not in seen:\n            entries.append({\"\
          service\": service, \"endpoint\": endpoint})\n            seen.add((service,\
          \ endpoint))\n            services.add(service)\n        trace_evidence.append({\n\
          \            \"traceId\": trace.get(\"traceId\", \"\"),\n            \"\
          duration\": trace.get(\"duration\", 0),\n            \"error\": trace.get(\"\
          error\", False),\n            \"slowestSpan\": trace.get(\"slowestSpan\"\
          ),\n            \"errorSpan\": trace.get(\"errorSpan\"),\n        })\n\n\
          \    return {\n        \"entries\": entries,\n        \"service_query\"\
          : \" \".join(sorted(services)),\n        \"trace_evidence\": trace_evidence,\n\
          \    }\n"
        code_language: python3

    - data:
        code: "\ndef main(red_json: str, history_red_json: str) -> dict:\n    # 处理当前数据\n\
          \    data = json.loads(red_json)\n    red = data.get('data', [])\n    latency_timeseries\
          \ = []\n    error_timeseries = []\n    latency_unit = ''\n    error_unit\
          \ = ''\n    for metric in red:\n        if metric.get('title') == 'Response\
          \ Time':\n            latency_timeseries = metric.get('timeseries', [])\n\
          \            latency_unit = metric.get('unit')\n        elif metric.get('title')\
          \ == 'Error Rate':\n            error_timeseries = metric.get('timeseries',\
          \ [])\n            error_unit = metric.get('unit')\n    latency_data = {\n\
          \        'data': {\n            'timeseries': latency_timeseries,\n    \
          \    },\n        'unit': latency_unit,\n    }\n    error_data = {\n    \
          \    'data': {\n            'timeseries': error_timeseries,\n        },\n\
          \        'unit': error_unit,\n    }\n    \n    # 处理历史数据\n    history_data\
          \ = json.loads(history_red_json)\n    history_red = history_data.get('data',\
          \ [])\n    history_latency_timeseries = []\n    history_error_timeseries\
          \ = []\n    history_latency_unit = ''\n    history_error_unit = ''\n   \
          \ for metric in history_red:\n        if metric.get('title') == 'Response\
          \ Time':\n            history_latency_timeseries = metric.get('timeseries',\
          \ [])\n            history_latency_unit = metric.get('unit')\n        elif\
          \ metric.get('title') == 'Error Rate':\n            history_error_timeseries\
          \ = metric.get('timeseries', [])\n            history_error_unit = metric.get('unit')\n\
          \    history_latency_data = {\n        'data': {\n            'timeseries':\
          \ history_latency_timeseries,\n        },\n        'unit': history_latency_unit,\n\
          \    }\n    history_error_data = {\n        'data': {\n            'timeseries':\
          \ history_error_timeseries,\n        },\n        'unit': history_error_unit,\n\
          \    }\n\n    return {\n        \"request_latency\": json.dumps(latency_data),\n\
          \        \"request_error_rate\": json.dumps(error_data),\n        \"history_request_latency\"\
          : json.dumps(history_latency_data),\n        \"history_request_error_rate\"\
          : json.dumps(history_error_data),\n    }\n"

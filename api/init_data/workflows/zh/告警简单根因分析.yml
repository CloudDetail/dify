    - data:
        code: |-
          import json


          # 两条曲线至少需要多少个公共采样点才计算相关性。调大可提高可信度但会漏掉短序列；调小会增加偶然相关。
          MIN_COMMON_POINTS = 4
          # Pearson 相关系数门槛。调大只保留更同步的曲线但可能漏掉弱关联；调小会增加相关证据，也更容易出现伪相关。
          CORRELATION_THRESHOLD = 0.70
          # 每条候选线程最多保留多少条辅助相关序列。调大可保留更多线索但增加 token；调小更精简。
          MAX_RELATED_ITEMS = 3
          # 候选或方向信号达到该评分后升级为强潜在异常。调大更保守；调小会让更多潜在线索升级为强异常；只影响方向分级，不影响候选入选。
          STRONG_SCORE_THRESHOLD = 0.80


          def _load(value, default):
              try:
                  return json.loads(value) if value else default
              except (TypeError, ValueError, json.JSONDecodeError):
                  return default


          def _proof_series(proof_data):
              if isinstance(proof_data, list):
                  return proof_data
              if isinstance(proof_data, dict):
                  return proof_data.get("data", {}).get("timeseries", []) or []
              return []


          def _identity(item, index):
              labels = item.get("labels", {}) or {}
              for key in ("dst_pod", "dst_ip", "pod", "container", "container_id", "pid", "tid_key"):
                  value = item.get(key) or labels.get(key)
                  if value:
                      return str(value)
              legend = item.get("legend")
              return str(legend) if legend else f"series_{index}"


          def _pearson(left, right):
              if len(left) < MIN_COMMON_POINTS or len(right) != len(left):
                  return None
              left_avg = sum(left) / len(left)
              right_avg = sum(right) / len(right)
              left_centered = [value - left_avg for value in left]
              right_centered = [value - right_avg for value in right]
              numerator = sum(x * y for x, y in zip(left_centered, right_centered))
              left_norm = sum(value * value for value in left_centered) ** 0.5
              right_norm = sum(value * value for value in right_centered) ** 0.5
              if left_norm == 0 or right_norm == 0:
                  return None
              return numerator / (left_norm * right_norm)


          def _related_evidence(chart, proof_data):
              related = []
              for index, item in enumerate(_proof_series(proof_data), start=1):
                  if not isinstance(item, dict):
                      continue
                  chart_container = item.get("chart") or {}
                  proof_chart = chart_container.get("chartData", chart_container)
                  common = sorted(set(chart) & set(proof_chart))
                  if len(common) < MIN_COMMON_POINTS:
                      continue
                  try:
                      left = [float(chart[timestamp]) for timestamp in common]
                      right = [float(proof_chart[timestamp]) for timestamp in common]
                  except (TypeError, ValueError):
                      continue
                  correlation = _pearson(left, right)
                  if correlation is not None and correlation >= CORRELATION_THRESHOLD:
                      related.append({
                          "name": _identity(item, index),
                          "correlation": round(correlation, 3),
                          "commonPointCount": len(common),
                      })
              related.sort(key=lambda item: (-item["correlation"], -item["commonPointCount"]))
              return related[:MAX_RELATED_ITEMS]


          def main(data_json: str, proof_json: str) -> dict:
              direction = "runq"
              detected = _load(data_json, {})
              proof_data = _load(proof_json, {})
              candidates = []

              for item in detected.get("candidates", []) or []:
                  compact = {key: value for key, value in item.items() if key not in ("chart", "labels")}
                  compact["relatedEvidence"] = _related_evidence(item.get("chart", {}), proof_data)
                  candidates.append(compact)

              candidates.sort(key=lambda item: (-item.get("score", 0), -item.get("contribution", 0)))
              direction_signals = detected.get("directionSignals", []) or []
              candidate_contribution = float(detected.get(
                  "candidateContribution",
                  min(1.0, sum(item.get("contribution", 0) for item in candidates)),
              ) or 0)
              thread_max_score = max([item.get("score", 0) for item in candidates] or [0])
              direction_max_score = max([item.get("score", 0) for item in direction_signals] or [0])
              max_score = max(thread_max_score, direction_max_score)
              strong_count = sum(1 for item in candidates if item.get("score", 0) >= STRONG_SCORE_THRESHOLD)
              strong_direction_count = sum(
                  1 for item in direction_signals if item.get("score", 0) >= STRONG_SCORE_THRESHOLD
              )

              if detected.get("activeThreadCount", 0) == 0:
                  status = "insufficient_data"
              elif not candidates and not direction_signals:
                  status = "no_significant_anomaly"
              elif max_score >= STRONG_SCORE_THRESHOLD:
                  status = "strong_potential_anomaly"
              else:
                  status = "potential_anomaly"

              result = {
                  "schemaVersion": detected.get("schemaVersion", "thread-window-anomaly-v4"),
                  "direction": direction,
                  "status": status,
                  "unit": detected.get("unit", ""),
                  "seriesCount": detected.get("seriesCount", 0),
                  "activeThreadCount": detected.get("activeThreadCount", 0),
                  "candidateCount": detected.get("candidateCount", len(candidates)),
                  "returnedCandidateCount": len(candidates),
                  "truncatedCandidateCount": detected.get("truncatedCandidateCount", 0),
                  "directionSignalCount": len(direction_signals),
                  "strongCandidateCount": strong_count,
                  "strongDirectionSignalCount": strong_direction_count,
                  "candidateContribution": round(candidate_contribution, 4),
                  "maxScore": round(max_score, 4),
                  "directionSignals": direction_signals,
                  "directionSummary": detected.get("directionSummary") or detected.get("directionDeviation") or {},
                  "directionDeviation": detected.get("directionDeviation"),
                  "topDeviations": detected.get("topDeviations", []) or [],
                  "candidates": candidates,
              }
              return {"result": json.dumps(result, ensure_ascii=False)}

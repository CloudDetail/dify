    - data:
        code: "import requests\nimport json\n\n\ndef get_red(service, cluster, start_time,\
          \ end_time) -> str:\n    query_params = {\"startTime\": start_time, \"endTime\"\
          : end_time, \"service\": service}\n    response = requests.get(\n      \
          \  \"http://syncause-backend-svc:8080\" + \"/api/dataplane/redcharts\",\
          \ params=query_params\n    )\n    data = []\n    if response.status_code\
          \ == 200 and len(response.json()[\"results\"]) != 0:\n        la = response.json()[\"\
          results\"][0][\"timeseries\"][0]\n        data.append(\n            {\n\
          \                \"type\": \"latency\",\n                \"name\": la[\"\
          legend\"],\n                \"unit\": \"ms\",\n                \"chartData\"\
          : la[\"chart\"][\"chartData\"],\n            }\n        )\n        er =\
          \ response.json()[\"results\"][1][\"timeseries\"][0]\n        data.append(\n\
          \            {\n                \"type\": \"errorRate\",\n             \
          \   \"name\": er[\"legend\"],\n                \"unit\": \"percent\",\n\
          \                \"chartData\": er[\"chart\"][\"chartData\"],\n        \
          \    }\n        )\n        tps = response.json()[\"results\"][2][\"timeseries\"\
          ][0]\n        data.append(\n            {\n                \"type\": \"\
          tps\",\n                \"name\": tps[\"legend\"],\n                \"unit\"\
          : \"tps\",\n                \"chartData\": tps[\"chart\"][\"chartData\"\
          ],\n            }\n        )\n        print(data)\n        return data\n\
          \    else:\n        return data\n\n\ndef main(service: str, startTime: int,\
          \ endTime: int) -> dict:\n    rc = get_red(service, \"\", startTime, endTime)\n\
          \    if rc is None:\n        rc = \"{}\"\n    return {\n        \"result\"\
          : json.dumps({\n            \"name\": \"服务监控指标\",\n            \"type\"\
          : \"red\",\n            \"data\": rc\n        })\n    }"

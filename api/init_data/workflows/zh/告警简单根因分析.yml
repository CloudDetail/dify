    - data:
        code: "import json\nfrom typing import Any\n\n\nRESOURCE_WEIGHTS = {\n   \
          \ \"cpu\": 1.0,\n    \"user\": 1.0,\n    \"sys\": 1.5,\n    \"runq\": 2.0,\n\
          \    \"sched\": 2.0,\n    \"net\": 3.0,\n    \"network\": 3.0,\n    \"socket\"\
          : 3.0,\n    \"tcp\": 3.0,\n    \"udp\": 2.5,\n    \"file\": 2.5,\n    \"\
          disk\": 2.5,\n    \"block\": 2.5,\n    \"fs\": 2.5,\n    \"epoll\": 3.0,\n\
          \    \"poll\": 3.0,\n    \"select\": 3.0,\n    \"io\": 2.5,\n    \"iowait\"\
          : 2.5,\n    \"lock\": 2.0,\n    \"mutex\": 2.0,\n    \"mem\": 1.5,\n   \
          \ \"memory\": 1.5,\n    \"gc\": 1.5,\n    \"other\": 1.0,\n}\n\n\ndef main(now_json:\
          \ str, history_json):\n    now_payload = _parse_payload(now_json)\n    history_payload\
          \ = _parse_payload(history_json)\n\n    now_groups = _group_timeseries(now_payload)\n\
          \    history_groups = _group_timeseries(history_payload)\n    instance_keys\
          \ = sorted(set(now_groups) | set(history_groups))\n    if len(instance_keys)\
          \ > 1:\n        raise ValueError(\"expected metrics for exactly one instance\"\
          )\n\n    instance_key = instance_keys[0] if instance_keys else _build_instance_key({})\n\
          \    now_resources = now_groups.get(instance_key, {})\n    history_resources\
          \ = history_groups.get(instance_key, {})\n    resource_types = sorted(set(now_resources)\
          \ | set(history_resources))\n\n    resource_scores = {}\n    score = 0.0\n\
          \    primary_resource = \"\"\n    primary_contribution = -1.0\n\n    for\
          \ resource_type in resource_types:\n        current_value = _average(now_resources.get(resource_type,\
          \ []))\n        baseline_value = _average(history_resources.get(resource_type,\
          \ []))\n        ratio = _safe_ratio(current_value, baseline_value)\n   \
          \     weight = _resource_weight(resource_type)\n        contribution = max(ratio\
          \ - 1.0, 0.0) * weight\n\n        resource_scores[resource_type] = {\n \
          \           \"current\": current_value,\n            \"baseline\": baseline_value,\n\
          \            \"ratio\": ratio,\n            \"weight\": weight,\n      \
          \      \"contribution\": contribution,\n        }\n        score += contribution\n\
          \n        if contribution > primary_contribution:\n            primary_contribution\
          \ = contribution\n            primary_resource = resource_type\n\n    result\
          \ = {\n        \"instance\": _decode_instance_key(instance_key),\n     \
          \   \"score\": round(score, 6),\n        \"primaryResource\": primary_resource,\n\
          \        \"resourceScores\": resource_scores,\n    }\n    return {\"result\"\
          : json.dumps(result, ensure_ascii=False)}\n\n\ndef _parse_payload(payload:\
          \ Any) -> dict[str, Any]:\n    if isinstance(payload, str):\n        return\
          \ json.loads(payload)\n    if isinstance(payload, dict):\n        return\
          \ payload\n    raise TypeError(\"payload must be a JSON string or dict\"\
          )\n\n\ndef _group_timeseries(payload: dict[str, Any]) -> dict[str, dict[str,\
          \ list[float]]]:\n    grouped: dict[str, dict[str, list[float]]] = {}\n\
          \    for series in payload.get(\"data\", {}).get(\"timeseries\", []):\n\
          \        labels = series.get(\"labels\", {})\n        resource_type = str(labels.get(\"\
          type\", \"other\") or \"other\").lower()\n        instance_key = _build_instance_key(labels)\n\
          \        grouped.setdefault(instance_key, {}).setdefault(resource_type,\
          \ []).extend(_chart_values(series))\n    return grouped\n\n\ndef _build_instance_key(labels:\
          \ dict[str, Any]) -> str:\n    pod = str(labels.get(\"pod\", \"\") or \"\
          \")\n    container_id = str(labels.get(\"containerId\", labels.get(\"container_id\"\
          , \"\")) or \"\")\n    pid = str(labels.get(\"pid\", \"\") or \"\")\n  \
          \  node = str(labels.get(\"node\", labels.get(\"node_name\", \"\")) or \"\
          \")\n    return json.dumps({\"pod\": pod, \"containerId\": container_id,\
          \ \"pid\": pid, \"node\": node}, sort_keys=True)\n\n\ndef _decode_instance_key(instance_key:\
          \ str) -> dict[str, str]:\n    return json.loads(instance_key)\n\n\ndef\
          \ _chart_values(series: dict[str, Any]) -> list[float]:\n    chart_data\
          \ = series.get(\"chart\", {}).get(\"chartData\", {})\n    values = []\n\
          \    for value in chart_data.values():\n        if value is None:\n    \
          \        continue\n        try:\n            values.append(float(value))\n\
          \        except (TypeError, ValueError):\n            continue\n    return\
          \ values\n\n\ndef _average(values: list[float]) -> float:\n    if not values:\n\
          \        return 0.0\n    return sum(values) / len(values)\n\n\ndef _safe_ratio(current_value:\
          \ float, baseline_value: float) -> float:\n    if baseline_value > 0:\n\
          \        return current_value / baseline_value\n    if current_value > 0:\n\
          \        return current_value\n    return 0.0\n\n\ndef _resource_weight(resource_type:\
          \ str) -> float:\n    return RESOURCE_WEIGHTS.get(resource_type.lower(),\
          \ 1.0)"

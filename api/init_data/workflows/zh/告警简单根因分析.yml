        prompt_template:
        - id: cd35fff4-a037-4e72-af99-2ff8299fc5d2
          role: system
          text: 你是可观测性领域的智能助手，协助用户分析解决问题。
        - id: 2b2ad468-efcd-4bcc-aeb9-d53d2f2770ad
          role: user
          text: "# 分析目标\n基于NET消耗的异常线程数据和RTT异常长数据，判断运行对象{{#v2_runtime_environment_context.location_text#}}是否受告警事件{{#1742807803325.alertName#}}影响，并进行初步根因定位。\n\
            \n# 输入数据规范\n- 线程在北极星指标NET上的异常消耗样本。\n- 当前运行对象相关的下游网络链路延迟异常消耗样本。\n\n# 分析规则\n\
            1. **主异常方向判定**\n- 标注异常线程的延迟均值。\n- 识别延迟增幅最显著的线程。\n- 根据RTT识别是自身异常还是下游异常\n\
            2. **网络链路延迟识别思路**\n- 网络链路延迟显著增高或接近0.05s附近\n- 若只有个别网络链路延迟出现异常（比如只有一个下游网络链路延迟异常）则认为网络异常是由下游导致，而非自身网络问题\n\
            - 若有多个网络链路延迟同步出现异常（比如有3个及以上下游网络链路延迟异常）则认为是当前运行对象自身网络出现问题，进而影响了网络链路延迟.\n\
            3. \n若无相关NET或网络链路延迟异常数据，则认为该时间段内对应数据无明显异常，可能只是出现短时间小幅波动。提示用户该数据无异常。\n\n\
            # 输出格式\n**运行对象**：{{#v2_runtime_environment_context.location_text#}}  \n\
            **北极星指标趋势摘要**\n- 按指标维度描述显著变化，若无异常标注\"未观测到显著偏离\"。\n**与下游网络链路延迟分析**\n- 如果是下游网络链路延迟异常则列出异常的网络链路延迟和对应下游。\n\
            - 如果是自身网络导致下游网络链路延迟异常则给出造成的影响并说明是自身原因导致与下游的网络链路延迟升高\n- 最后根据分析规则判断错误方向。\n\
            \n\n**初步根因结论**\n- 明确告警事件对应用的影响状态。\n- 基于北极星指标与分析规则输出单一归因结论。\n\n# 输入数据\n\
            - 北极星指标NET消耗异常均值最高的实例{{#1747356893645.top_abnormal_means#}}，北极星指标NET消耗异常增速均值最高的实例{{#1747356893645.top_abnormal_growths#}}\n\
            - 网络链路延迟异常消耗均值最高的实例{{#1747356893645.top_abnormal_means#}}\n网络链路延迟异常增速均值最高的实例\n\
            \n# 输出准则\n- 使用简洁的非技术表述，避免歧义。\n- 结论需聚焦可执行建议（如\"检查代码嵌套\"而非\"可能存在性能问题\"）。\n\
            \n# 运行环境约束\n{{#v2_runtime_environment_context.prompt_context#}}\n运行环境上下文优先于知识库或通用示例；若知识库命令与当前环境冲突，必须忽略冲突命令。\n\
            \n# 输出身份与环境规则\n- 服务名：{{#1754299310647.service#}}。服务名为空时省略服务字段，禁止输出任何占位服务名或“未知服务”。\n\
            - 运行对象：{{#v2_runtime_environment_context.location_text#}}。\n- 对象类型：{{#v2_runtime_environment_context.instance_term#}}。\n\
            - {{#v2_runtime_environment_context.prompt_context#}}\n- 不得因为指标或工具名称包含“按Pod统计”就推断当前一定是\
            \ Pod 或容器；必须服从运行环境上下文。\n- 示例中的 xx、xxx、XXXX 仅用于说明格式，禁止原样复制到最终报告或 JSON。\n"

    - data:
        code: "import json\nfrom typing import Any\n\n\ndef main(data: list[str])\
          \ -> dict:\n    best_record = None\n    best_score = float(\"-inf\")\n\n\
          \    for item in data:\n        parsed = _parse_record(item)\n        if\
          \ parsed is None:\n            continue\n\n        score = _to_float(parsed.get(\"\
          score\", 0.0))\n        if score > best_score:\n            best_score =\
          \ score\n            best_record = parsed\n\n    if best_record is None:\n\
          \        return _empty_result()\n\n    return {\n        \"pod\": _read_pod(best_record),\n\
          \        \"namespace\": str(best_record.get(\"namespace\", \"\") or \"\"\
          ),\n        \"pid\": _read_pid(best_record),\n        \"node\": _read_node(best_record),\n\
          \    }\n\n\ndef _parse_record(item: Any) -> dict[str, Any] | None:\n   \
          \ if isinstance(item, str):\n        return json.loads(item)\n    return\
          \ None\n\n\ndef _read_pod(record: dict[str, Any]) -> str:\n    instance\
          \ = record.get(\"instance\")\n    if isinstance(instance, dict):\n     \
          \   return str(instance.get(\"pod\", \"\") or \"\")\n    return str(record.get(\"\
          podName\", record.get(\"pod\", \"\")) or \"\")\n\n\ndef _read_pid(record:\
          \ dict[str, Any]) -> str:\n    instance = record.get(\"instance\")\n   \
          \ if isinstance(instance, dict):\n        return str(instance.get(\"pid\"\
          , \"\") or \"\")\n    return str(record.get(\"pid\", \"\") or \"\")\n\n\n\
          def _read_node(record: dict[str, Any]) -> str:\n    instance = record.get(\"\
          instance\")\n    if isinstance(instance, dict):\n        return str(instance.get(\"\
          node\", \"\") or \"\")\n    return str(record.get(\"nodeName\", record.get(\"\
          node\", \"\")) or \"\")\n\n\ndef _to_float(value: Any) -> float:\n    try:\n\
          \        return float(value)\n    except (TypeError, ValueError):\n    \
          \    return 0.0\n\n\ndef _empty_result() -> dict[str, str]:\n    return\
          \ {\n        \"pod\": \"\",\n        \"namespace\": \"\",\n        \"pid\"\
          : \"\",\n        \"node\": \"\",\n    }"

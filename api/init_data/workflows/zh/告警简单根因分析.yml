    - data:
        context:
          enabled: true
          variable_selector:
          - '1758694051591'
          - alert_result
        desc: ''
        isInIteration: true
        iteration_id: '1741497176064'
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: apo-gpt-5.4
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: cd35fff4-a037-4e72-af99-2ff8299fc5d2
          role: system
          text: 你是可观测性领域的智能助手，协助用户分析解决问题。
        - id: 2b2ad468-efcd-4bcc-aeb9-d53d2f2770ad
          role: user
          text: |-
            # 分析目标
            根据当前告警窗口内 CPU、网络、文件操作、Epoll 等待、运行队列五个方向的线程消耗候选，判断运行对象{{#v2_runtime_environment_context.location_text#}}存在的潜在线程消耗问题，并结合网络往返延迟数据总结给出分析结论。

            # 数据口径
            1. 五个方向的数据由确定性算法在当前窗口内筛选，不使用历史基线。线程尖峰的潜在门槛为峰值倍率>=1.5且稳健Z值>=4，强门槛为倍率>=2且稳健Z值>=4，极端门槛为倍率>=4且稳健Z值>=8；当窗口内MAD为0、无法计算稳健Z值时，算法仅按对应倍率回退判断。阶跃突增的潜在/强门槛分别为1.5倍/2倍，并要求前后平台相对稳定、变化后持续；方向集体阶跃的强级别不再额外要求尖峰Z值。算法还识别突然激活、方向内重度消费者和同方向离群线程。
            2. “方向集体尖峰/集体阶跃/集体激活”是独立的方向聚合信号，用于发现多条线程同步抬升；它不是伪造的线程候选。“存在强潜在异常”高于“存在潜在异常”；“未筛出达到阈值的候选”只表示当前窗口内没有满足筛选条件，不能证明该方向正常；“数据不足”不得解释为正常。
            3. 评分用于当前方向内候选排序，不是故障概率。候选贡献表示候选线程整窗消耗占该方向活跃线程总消耗的比例，只用于描述影响范围和排序，不能单独证明强异常；“方向集体阶跃”表示多条线程从变化前平台同步抬升并维持，“持续上升/持续下降”只是当前窗口趋势，不自动等同于异常。
            4. 每个方向摘要都包含当前窗口趋势（首段/末段/峰值）、窗口内正值中位数基线、P95、代表性异常值和时间模式。趋势不是历史趋势；`异常值`表示方向聚合达到阈值后的代表点，`代表偏离值`表示尚未达到方向阈值、仅用于保留上下文的高位点，不能把后者当成已确认异常；模式用于描述孤立尖峰、阶跃、突然激活或多线程同步，不可单独作为根因。
            5. 辅助相关序列只表示时间上同步变化，不代表因果关系。网络和 Epoll 候选不能脱离网络往返延迟或下游证据直接归因为网络故障。
            6. Epoll 等待升高可能是正常等待；只有候选强度明显并且存在网络往返延迟或下游证据时，才能提升其问题优先级。

            # 分析步骤
            1. 列出所有状态为“存在强潜在异常”或“存在潜在异常”的方向，方向聚合信号与线程候选均需保留，不得只因某个方向排名最高而遗漏其他候选方向。
            2. 选择主要方向时依次比较：方向状态、最高评分、候选贡献、最强候选线程的异常类型和峰值倍率；候选线程数量只作为次要参考。禁止使用固定的 CPU、网络、Epoll、文件、RunQ 优先级。
            3. 潜在线程尖峰/阶跃表示已达到较宽松的召回门槛但尚未达到强门槛；尖峰表示短时高点，稀疏尖峰表示窗口内仅出现一至两个离散高点；阶跃突增表示从低位突然升高并短时维持，方向集体阶跃还会展示同步阶跃线程数；突然激活表示此前接近零后出现连续消耗；重度消费者/同方向离群表示该线程相对同方向其他线程占用突出。
            4. 网络或 Epoll 为主要方向时，必须结合网络往返延迟总结区分：自身网络质量问题、具体下游依赖问题、或证据不足。没有明确下游证据时不得编造服务、Pod、接口或节点。
            5. 如果多个方向强度接近，明确给出“主要候选方向”和“其他潜在方向”，不要强行断言唯一根因。所有方向均无候选时，可以比较输入中的“未达阈值偏离”指出最接近门槛、值得优先检查的方向，但这些只是弱证据，不得描述成已发生异常或据此断言根因；结论应为“当前窗口未筛出达到阈值的线程消耗候选”。

            # 知识库使用要求
            {{#context#}}
            - 优先使用与告警{{#1742807803325.alertName#}}或服务{{#1754299310647.service#}}直接相关的历史告警、解决思路、负责人和业务名称映射。
            - 使用知识库内容时注明文档名称；无相关内容时基于输入证据回答。
            - 如果文档包含服务名与业务名映射，输出必须使用业务名；没有映射时保留真实服务名。

            # 输入数据
            - CPU：{{#17443388433580.result#}}
            - 网络：{{#17443388438160.result#}}
            - 文件操作：{{#17443388421360.result#}}
            - Epoll：{{#1744290470304.result#}}
            - 运行队列：{{#17443388443000.result#}}
            - 网络往返延迟数据总结：{{#1754298166852.result#}}

            # 输出格式
            **服务**：{{#1754299310647.service#}}
            **运行对象**：{{#v2_runtime_environment_context.location_text#}}
            **对象类型**：{{#v2_runtime_environment_context.instance_term#}}

            **线程消耗候选摘要**
            - 先按方向列出趋势、窗口基线、峰值、代表性异常值和异常模式，再列出关键候选线程、异常类型、峰值倍率和方向贡献；没有达到阈值的方向仍应结合趋势摘要说明，不能只写“正常”。

            **初步分析结论**
            - 给出主要候选方向、其他潜在方向、证据边界和具体下一步检查建议。
            - 使用简洁的非技术表述；RunQ 表述为 CPU 调度等待，RTT 表述为网络往返延迟。
            - 不得使用“超过历史均值”“历史异常”等当前输入无法证明的表述。

            # 运行环境约束
            {{#v2_runtime_environment_context.prompt_context#}}
            运行环境上下文优先于知识库或通用示例；冲突命令必须忽略。
            服务名为空时省略服务字段，禁止输出占位服务名或“未知服务”。不得因为指标或工具名称包含“按Pod统计”就推断当前一定是 Pod 或容器。示例中的占位文本不得出现在最终结果中。

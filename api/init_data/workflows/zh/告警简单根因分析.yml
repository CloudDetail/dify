        prompt_template:
        - id: 6d2d37cf-5d8d-4ec8-bf8b-040480010021
          role: system
          text: 你是可观测性报告展示结构生成助手，只输出严格 JSON。
        - id: 6d2d37cf-5d8d-4ec8-bf8b-040480010022
          role: user
          text: "# 目的\n基于现有报告字段，生成新版 /report 页面使用的增量 reportView。不要修改或替代已有 overview、tags、topology、rootCauseAnalysis、suggest、evidence\
            \ 输出结构。\n\n# 输入\nreportType: slow\n\noverview:\n{{#1750661889002.result#}}\n\
            \nrootCauseAnalysis:\n{{#1750672701216.result#}}\n\nsuggest:\n{{#17506728633540.result#}}\n\
            \nevidence:\n{{#1750769951427.result#}}\n\ntopology:\n{{#1750750056742.result#}}\n\
            \n# 输出格式\n只输出一个 JSON 对象，不要 Markdown，不要代码块，不要解释，不要输出报告 id、生成时间、分析窗口。\n\
            {\n  \"version\": \"v1\",\n  \"headline\": \"一句话根因判断\",\n  \"conclusionSummary\"\
            : \"一句话说明关键证据；如包含时间，必须使用转换后的可读时间（YYYY-MM-DD HH:mm:ss），不要输出时间戳原值\",\n \
            \ \"faultLocation\": {\"label\": \"故障位置\", \"target\": \"服务/实例/节点\", \"\
            summary\": \"简单说明\"},\n  \"summaryCards\": [{\"type\": \"symptom|rootCause|excluded\"\
            , \"title\": \"短标题\", \"summary\": \"一句话\"}],\n  \"rootCauseEvidenceRefs\"\
            : [{\"evidenceIndex\": 0, \"title\": \"CPU 使用率\", \"summary\": \"45% ->\
            \ 96%\"}],\n  \"rootCauseMetricRefs\": [{\"evidenceIndex\": 0, \"title\"\
            : \"CPU 使用率\", \"summary\": \"45% -> 96%\"}],\n  \"businessImpact\": null,\n\
            \  \"timeline\": [{\"timestamp\": 1779811334000000, \"title\": \"事件短标题\"\
            , \"summary\": \"一句话事件说明\"}],\n  \"analysisSteps\": [{\"title\": \"排查步骤短标题\"\
            , \"summary\": \"一句话说明\"}],\n  \"actionTitles\": [{\"suggestIndex\": 0,\
            \ \"title\": \"降低异常日志输出\"}],\n  \"evidenceHighlights\": [{\"evidenceIndex\"\
            : 0, \"title\": \"CPU 使用率升高\", \"summary\": \"使用原始证据中的结论或描述\"}]\n}\n\n\
            # 严格规则\n1. 主根因方向只取 rootCauseAnalysis.other 中 level=major 的 type。type 别名归一：disk\
            \ 按 storage，file 按 runtime/storage，memory 按 runtime/infra，system 按 infra/runtime/cpu/memory，config\
            \ 按 config/dependency/log，self 按 code/log/runtime。没有这个 type 时，不要为了支撑证据做推断，rootCauseEvidenceRefs\
            \ 和 rootCauseMetricRefs 输出空数组。\n2. 首屏右上角支撑证据只放根因证据：从 evidence 中选择与主根因直接相关的\
            \ type=metrics/red/log/traces 证据，写入 rootCauseEvidenceRefs。rootCauseEvidenceRefs\
            \ 是首屏支撑证据唯一来源，evidenceIndex 使用 evidence 数组的从 0 开始下标。\n3. 引用 metrics/red\
            \ 时必须有真实 chartData，指标名称、描述、legend、unit 必须匹配主根因方向；引用 log/traces 时 title/summary\
            \ 必须直接描述异常日志、慢 span、下游调用或超时事实。rootCauseEvidenceRefs/rootCauseMetricRefs\
            \ 的 summary 如引用耗时、延迟、慢 span 等时间指标，必须使用可读时间单位，不要直接输出原始裸小数秒；例如 0.0019s 应写成\
            \ 1.9ms，0.0007s 应写成 0.7ms。\n4. downstream/dependency 根因必须优先引用具体下游服务、具体接口耗时、错误率、超时、慢调用分布、下游数据库/MySQL/SQL\
            \ 查询耗时、锁等待、连接池等待、下游调用异常日志或慢 trace；如果 major reason 已给出下游服务、接口或数据库实例，例如\
            \ ts-travel-plan-service 的 POST /api/v1/travelplanservice/travelPlan/cheapest，则优先引用该服务/接口的耗时、错误、超时指标、异常日志或慢\
            \ trace；例如 ts-config-service 访问 train-ticket-mysql-master-0 时 SQL 查询变慢、锁等待或连接池等待升高，则优先引用\
            \ MySQL/数据库/SQL/锁等待/连接池等待相关 evidence；如果只有日志证据，例如 requesttemplate-demo\
            \ 调用 localhost:58082 /api/jpa-demo/sleep 出现 ResourceAccessException、SocketTimeoutException、Read\
            \ timed out，也必须写入 rootCauseEvidenceRefs，不要因为没有 chartData 而留空。\n5. RED\
            \ 指标只允许在 downstream、dependency、traffic、thirdparty 根因下作为证据；cpu、code、log、retry、net、storage、runtime、infra\
            \ 根因下禁止用 RED、平均延迟、错误率、吞吐量兜底。\n6. rootCauseMetricRefs 仅作为兼容字段：只有 rootCauseEvidenceRefs\
            \ 中引用 metrics/red 证据且有真实 chartData 时才同步填入；没有匹配主根因的指标时 rootCauseMetricRefs\
            \ 输出空数组，不要放无关指标。\n7. 支撑证据映射：cpu 使用 CPU 使用率、容器 CPU、进程 CPU、CPU throttling、load\
            \ average；code 使用异常数、错误日志数、错误码、Exception、panic、stack；log 使用错误日志数、日志打印量、日志增长率、相同错误模板数；retry\
            \ 使用重试次数、重试率、重复调用次数、下游调用突增；net 使用 RTT、连接失败、连接超时、TCP 重传、丢包、DNS 失败；storage/disk\
            \ 使用 DB 查询耗时、慢 SQL、磁盘 IO、磁盘使用率、连接池等待、SQL 错误；runtime/file/memory 使用 GC、堆内存、线程、协程、FD、文件描述符、OOM；infra/system\
            \ 按运行环境选择证据：VM 使用主机资源、进程状态和系统日志；容器使用 Pod 重启、OOMKill、节点资源、容器状态和 K8s Event；环境不明确时使用通用\
            \ CPU、内存和系统证据；config 使用配置拉取失败、配置中心错误、DB 连接失败、连接串/凭据错误、初始化失败日志；self 使用应用异常、错误日志、panic、stack、runtime\
            \ 异常；downstream/dependency 使用下游延迟、下游错误率、下游超时、依赖 5xx、具体下游服务/接口耗时、慢调用分布、下游数据库/MySQL、SQL\
            \ 查询耗时、锁等待、连接池等待、异常日志、慢 trace；traffic 使用 QPS、RPS、请求量、并发、队列、突增比例；thirdparty\
            \ 使用第三方延迟、错误率、超时、供应商错误码。\n8. faultLocation 必须简单易懂；无法定位时输出 null。\n9. businessImpact\
            \ 没有明确业务影响时输出 null，不要编造。\n10. actionTitles 必须是你重新概括的短标题，最多 12 个字，不要直接截断原建议。\n\
            11. evidenceHighlights 只服务关键证据摘要，不是首屏支撑证据来源；summary 优先使用原始 evidence 中已有结论或描述，保持原文事实。正常或已排除证据必须明确写成排除依据，不能替代\
            \ rootCauseEvidenceRefs，不能伪装成支撑指标。\n12. conclusionSummary 如包含时间，必须使用转换后的可读时间（YYYY-MM-DD\
            \ HH:mm:ss），禁止输出 Unix 秒/毫秒/微秒时间戳原值。\n13. timeline 只使用 {\"timestamp\":\
            \ number, \"title\": string, \"summary\": string} 结构；timestamp 必须是真实微秒时间戳，title\
            \ 写短标题，summary 写一句话事件说明。\n14. 有明确时间点或可换算时间戳时才输出 timeline；禁止输出 time、detail、content、description\
            \ 字段；没有明确时间点时 timeline 输出空数组，把无时间点内容写入 analysisSteps。\n15. analysisSteps\
            \ 只使用 {\"title\": string, \"summary\": string} 结构，不输出 timestamp、time、detail\
            \ 字段。\n16. summaryCards 是首屏摘要，必须简洁，最多输出 3 张卡片：symptom、rootCause、excluded。rootCause\
            \ 卡必须从 rootCauseAnalysis.other 中 level=major 的方向归纳；excluded 卡只能从 rootCauseAnalysis.other\
            \ 中 level=normal 的方向归纳。excluded.title 使用真实方向，例如“已排除 CPU、文件方向”，excluded.summary\
            \ 尽量不超过 50 个中文字，必须归纳成一句自然语言，不得直接拼接多个 reason，不得机械罗列多个方向；不得把 level=minor\
            \ 写入 excluded；没有明确 level=normal 排除项时不要编造 excluded。\n\n\n# 运行环境约束\n{{#v2_runtime_environment_context.prompt_context#}}\n\
            运行环境上下文优先于知识库或通用示例；若知识库命令与当前环境冲突，必须忽略冲突命令。\n\n# 输出身份与环境规则\n- 服务名：{{#1754299310647.service#}}。服务名为空时省略服务字段，禁止输出任何占位服务名或“未知服务”。\n\
            - 运行对象：{{#v2_runtime_environment_context.location_text#}}。\n- 对象类型：{{#v2_runtime_environment_context.instance_term#}}。\n\
            - {{#v2_runtime_environment_context.prompt_context#}}\n- 不得因为指标或工具名称包含“按Pod统计”就推断当前一定是\
            \ Pod 或容器；必须服从运行环境上下文。\n- 示例中的 xx、xxx、XXXX 仅用于说明格式，禁止原样复制到最终报告或 JSON。\n"

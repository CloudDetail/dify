        prompt_template:
        - id: 169877de-aa4a-44db-90ef-2cc8f68882c4
          role: system
          text: 你是可观测性领域的智能助手，协助用户分析解决问题。
        - id: c9d29276-dfa5-4042-b1c6-562260f9cc7c
          role: user
          text: '# 目的

            基于服务层级聚合运行对象信息并输出服务级概览报告，清晰呈现各主机进程、实例或 Pod 的实际运行状态。

            同时在原有的结论基础上，根据文档和你的经验针对异常线程最多的根因方向给出具体执行解决问题的建议和与问题相关的需要执行的命令。

            # 可执行命令举例

            根因为CPU：使用top -H -p <PID>查看占用，pidstat -t -p <PID> 1查看使用率等命令

            根因为网络质量问题：ss -s查看全局socket状态，ss -tunap查看所有TCP/UDP连接，nstat -z 查看重传等命令

            根因为 EPOLL：保留 EPOLL 作为异常方向，但建议从网络连接和等待原因排查。优先结合 RTT、下游 Span、超时和重传证据；可按证据选择
            ss -s、ss -antp、nstat -az、sar -n TCP,ETCP 1、ip -s link。不要默认建议跟踪 epoll 系统调用，也不要机械输出全部命令。

            根因为CPU抢占（runq）：dstat -l 1 查看系统负载，mpstat -P ALL 1查看CPU的%idle和%util等命令

            根因为文件读取（file）：iotop -o -p <PID>查看进程级磁盘IO，strace -e trace=file -tt -T -p
            <PID>查看文件相关的系统调用等命令

            # 文档

            {{#context#}}

            ## 使用要求

            优先根据文档中的与当前告警或服务{{#1754299310647.service#}}相关的内容进行回答，如果文档中没有相关内容则根据你的经验回答。如果使用了文档中的内容要给内容出处文档名称，表明是“根据xx文档，建议执行xx”。

            1. 注意关键寻找文档中包括但不限于历史告警、解决思路、负责人员、业务名称对照等信息。

            2. 优先根据根因中的结论进行方向判断，确认根因方向之后在文档中检索与根因方向相关的内容。

            3. 需要聚焦于与根因方向相关的文档片段，忽略无关的文档片段。

            4. 如果文档中包含服务名与业务名的映射，则所有出现的服务名称必须使用业务名描述，且不能遗漏，没有则忽略这条规则。如order-service对应订单服务，在描述根因时必须使用订单服务而不是order-service。

            # 注意事项

            1. 结论中若CPU相关告警事件综合影响系数较高，应优先指导处理CPU资源瓶颈

            2. 采用树状层级化输出格式，服务级汇总指标与运行对象明细指标需通过缩进形成清晰继承关系

            3. 故障归因分析需保持单一维度，禁止构建跨维度关联（如GC与锁竞争）

            4. 当网络栈耗时(net)异常增高但网络往返延迟(RTT)处于基线范围时，需重点提示检查下游依赖服务


            # 结论数据源

            {{#1754385689812.output#}}




            # 运行环境约束

            {{#v2_runtime_environment_context.prompt_context#}}

            运行环境上下文优先于知识库或通用示例；若知识库命令与当前环境冲突，必须忽略冲突命令。


            # 输出身份与环境规则

            - 服务名：{{#1754299310647.service#}}。服务名为空时省略服务字段，禁止输出任何占位服务名或“未知服务”。

            - 运行对象：{{#v2_runtime_environment_context.location_text#}}。

            - 对象类型：{{#v2_runtime_environment_context.instance_term#}}。

            - {{#v2_runtime_environment_context.prompt_context#}}


    - data:
        code: |-
          import json
          import math


          # 至少需要多少个采样点才分析一条线程。调大可减少短序列误报，但会漏掉短告警窗口；调小则相反。
          MIN_SAMPLE_COUNT = 5
          # 至少需要多少个非零点。调大可过滤偶发活动，但会漏掉单点/双点尖峰；当前保留为 1，再由稀疏尖峰规则过滤。
          MIN_ACTIVE_COUNT = 1
          # detector 最多传给 analyze 的线程候选数。调大可保留更多线索但增加运行时间和中间数据量；调小更省资源但可能截断低排名候选。
          MAX_CANDIDATES = 20
          # 所有线程都未达阈值时保留的最接近阈值线程数。调大可给模型更多弱线索但增加 token；调小更精简。
          MAX_FALLBACK_DEVIATIONS = 3
          # 计算趋势首段/末段中位数时使用的采样点数。调大可平滑单点噪声但会掩盖短突变；调小更敏感但更易受噪声影响。
          TREND_WINDOW_SIZE = 3
          # 首尾趋势变化的相对门槛。调大只标记更明显的持续上升/下降；调小会提高趋势召回但增加轻微波动标记。
          TREND_CHANGE_RATIO = 0.15
          # 活跃点占比不高且被零值分成多个片段时标记为间歇性。调大更容易暴露断续消耗，但正常的零值采样也更容易被标记；调小更保守。
          INTERMITTENT_MAX_ACTIVE_FRACTION = 0.50
          # 每条线程或方向摘要最多保留多少个异常值。调大可提供更多上下文但增加 token；调小更精简。
          MAX_ANOMALY_POINTS = 3
          # 方向摘要的高分位值，用于补充量级信息。调大更关注极端高点；调小更接近整体水平。
          SUMMARY_PERCENTILE = 0.95

          # 普通统计偏离门槛。调大可降低噪声误报但会漏掉较平滑的突增；调小可提高召回率但会放大正常波动；MAD=0无法计算Z值时仅按倍率回退判断。
          SPIKE_Z_THRESHOLD = 4.0
          # 潜在线程尖峰的最低倍率。调大更保守；调小更容易识别 50% 左右的突增，也更容易误报。
          POTENTIAL_SPIKE_RATIO = 1.5
          # 强线程尖峰的最低倍率。调大只保留更剧烈的尖峰；调小会让更多候选直接进入强异常。
          STRONG_SPIKE_RATIO = 2.0
          # 极端尖峰的稳健 Z 值门槛。调大可减少极端误判；调小会让更多尖峰获得最高优先级。
          EXTREME_Z_THRESHOLD = 8.0
          # 极端尖峰的倍率门槛。调大只保留非常剧烈的事件；调小会扩大极端尖峰范围。
          EXTREME_RATIO_THRESHOLD = 4.0

          # 阶跃前后各最多比较几个点。调大更关注持续变化但会钝化短突变；调小更敏感但更容易受单点波动影响。
          STEP_WINDOW_SIZE = 3
          # 阶跃至少需要多少个变化后点维持高位。调大可过滤短暂抖动但会漏掉短窗口突增；调小提高召回但更易误报。
          MIN_STEP_PERSISTENCE_POINTS = 2
          # 潜在阶跃的前后中位数倍率。调大更保守；调小可发现较弱但持续的抬升。
          POTENTIAL_STEP_RATIO = 1.5
          # 强阶跃倍率。调大只保留更明显的持续抬升；调小会增加强异常数量。
          STRONG_STEP_RATIO = 2.0
          # 判断阶跃持续点时，相对阶跃前中位数的倍率。调大要求维持在更高水平；调小更容易认为变化持续。
          STEP_PERSISTENCE_RATIO = 1.5
          # 阶跃前后平台允许的最大相对波动范围。调大可容忍噪声但更容易把平滑上升误判为阶跃；调小更严格地要求平台稳定，但可能漏掉抖动较大的真实阶跃。
          STEP_PLATFORM_VARIATION = 0.35
          # 阶跃首个高位点相对前一采样点的最低跳变比例。调大只保留更突然的变化；调小提高弱突增召回，但会增加渐变误报。
          STEP_EDGE_CHANGE_RATIO = 0.15

          # 方向聚合尖峰的最低覆盖率。调大可避免缺失线程造成假波动，但可能因少量缺失而跳过检测；调小则相反。
          DIRECTION_MIN_COVERAGE_RATIO = 0.80
          # 至少多少条活跃线程才计算方向集体信号。调大可避免少量线程被误称为集体异常，但会漏掉小线程池；调小会提高小线程池召回率。
          DIRECTION_MIN_THREADS = 2
          # 方向聚合潜在尖峰倍率。调大可减少集体波动误报；调小可发现更多同步上涨。
          DIRECTION_POTENTIAL_RATIO = 1.5
          # 方向聚合强尖峰倍率。调大只保留更剧烈的整体上涨；调小会增加强方向信号。
          DIRECTION_STRONG_RATIO = 2.0
          # 方向聚合稳健 Z 值门槛。调大更抗噪但更容易漏报；调小更敏感但更容易把正常同步波动当异常；MAD=0时仅按倍率回退判断。
          DIRECTION_Z_THRESHOLD = 4.0
          # 方向集体尖峰升级为强异常所需的稳健 Z 值。调大可避免仅靠倍率升级；调小会让更多集体尖峰成为强信号；集体阶跃由平台稳定、持续点和同步线程判强，不使用该Z；MAD=0时尖峰仅按强倍率回退判断。
          DIRECTION_STRONG_Z_THRESHOLD = 8.0
          # 在聚合峰值时，单线程至少相对自身中位数上涨多少才算同步上涨成员。调大可减少伪同步；调小可发现更温和的集体抬升。
          DIRECTION_MEMBER_RISE_RATIO = 1.20
          # 聚合峰值时至少多少比例的已覆盖线程同步上涨。调大要求更一致；调小可容忍部分线程不变，但更容易被少数线程主导。
          DIRECTION_MIN_RISING_FRACTION = 0.50
          # 集体从零激活时，至少连续多少个点保持正值。调大可过滤瞬时抖动但会漏掉短激活；调小更敏感但噪声更多。
          DIRECTION_ACTIVATION_PERSISTENCE = 2
          # 集体激活线程至少占该时刻已覆盖线程的比例。调大要求激活更普遍但会漏掉局部集体激活；调小可提高召回率但更容易被少数线程触发。
          DIRECTION_MIN_ACTIVATION_FRACTION = 0.50

          # 线程峰值至少达到方向所有正值的该分位数，才认为绝对量级有意义。调大可过滤小值噪声；调小可保留更多低量级候选。
          MAGNITUDE_PERCENTILE = 0.75
          # 激活/稀疏尖峰用于比较的高分位数。调大要求更明显的方向内离群；调小会增加稀疏候选。
          ACTIVATION_OUTLIER_PERCENTILE = 0.90
          # 激活峰值相对方向中位数的最低倍率。调大可过滤普通活动；调小会更容易识别新出现的线程消耗。
          ACTIVATION_MEDIAN_RATIO = 2.0
          # 即使未达到量级分位数，只要线程贡献达到该值也可继续分析。调大可减少低贡献候选；调小会保留更多线程。
          MIN_DIRECTION_CONTRIBUTION = 0.01
          # 激活线程成为方向主导者所需贡献。调大只保留主要线程；调小会让更多激活线程通过。
          ACTIVATION_DOMINANT_CONTRIBUTION = 0.20
          # 激活线程相对其他线程中位数的倍率。调大可减少同量级线程误报；调小可提高激活召回率。
          ACTIVATION_DOMINANT_PEER_RATIO = 2.0

          # 两线程场景下重度消费者的贡献门槛。调大要求更集中；调小会让两条接近的线程也可能入选。
          SMALL_POOL_HEAVY_CONTRIBUTION = 0.50
          # 两线程场景下相对另一线程的倍率。调大更严格；调小更容易发现小线程池中的主导线程。
          SMALL_POOL_HEAVY_PEER_RATIO = 3.0
          # 三条及以上线程时重度消费者的贡献门槛。调大只保留贡献更大的线程；调小会增加候选数。
          GENERAL_HEAVY_CONTRIBUTION = 0.20
          # 三条及以上线程时重度消费者的同类倍率。调大可减少误报；调小可发现较温和的主导线程。
          GENERAL_HEAVY_PEER_RATIO = 2.5
          # 同方向离群线程的同类倍率。调大只保留极端离群；调小会增加离群候选。
          PEER_OUTLIER_RATIO = 3.0

          # 潜在时间异常允许的最高评分，必须低于 Analyze 的强状态阈值。调大到强阈值以上会把潜在线索误升为强异常；调小会降低潜在线索排序。
          POTENTIAL_TEMPORAL_SCORE_CEILING = 0.79
          # 强时间异常的最低评分，必须不低于 Analyze 的强状态阈值。调大会让强信号排序更靠前；调低到强状态阈值以下会造成强信号无法升级方向状态。
          STRONG_SCORE_FLOOR = 0.80
          # 极端时间异常的最低评分，也必须不低于 Analyze 的强状态阈值。调大使极端信号更靠前；调低到强状态阈值以下可能使极端信号无法升级方向状态。
          EXTREME_SCORE_FLOOR = 0.90

          # 防止除零，不是业务阈值，通常无需调整。
          EPSILON = 1e-12


          def _number(value):
              if isinstance(value, bool):
                  return None
              try:
                  value = float(value)
              except (TypeError, ValueError):
                  return None
              if not math.isfinite(value) or value < 0:
                  return None
              return value


          def _median(values):
              if not values:
                  return 0.0
              ordered = sorted(values)
              middle = len(ordered) // 2
              if len(ordered) % 2:
                  return float(ordered[middle])
              return float((ordered[middle - 1] + ordered[middle]) / 2.0)


          def _percentile(values, percentile):
              if not values:
                  return 0.0
              ordered = sorted(values)
              position = (len(ordered) - 1) * percentile
              lower = int(math.floor(position))
              upper = int(math.ceil(position))
              if lower == upper:
                  return float(ordered[lower])
              weight = position - lower
              return float(ordered[lower] * (1.0 - weight) + ordered[upper] * weight)


          def _timestamp_key(timestamp):
              try:
                  return (0, float(timestamp))
              except (TypeError, ValueError):
                  return (1, str(timestamp))


          def _clean_points(chart):
              points = []
              for timestamp, raw_value in (chart or {}).items():
                  value = _number(raw_value)
                  if value is not None:
                      points.append((str(timestamp), value))
              points.sort(key=lambda item: _timestamp_key(item[0]))
              return points


          def _positive_run_count(values):
              """统计被零值分隔的连续正值片段，用于区分间歇活动和单次激活/结束。"""
              run_count = 0
              in_run = False
              for value in values:
                  if value > EPSILON:
                      if not in_run:
                          run_count += 1
                      in_run = True
                  else:
                      in_run = False
              return run_count


          def _has_prior_rise(values, index, reference=None):
              """确认峰值前存在可观测的低位，避免把窗口起点的高位误称为突增。"""
              # 该上升沿复用 TREND_CHANGE_RATIO；调大更能抑制窗口边界误报，调小更容易保留弱突增。
              if index <= 0:
                  return False
              prior = values[max(0, index - TREND_WINDOW_SIZE):index]
              if not prior:
                  return False
              prior_median = _median(prior)
              if reference is None:
                  reference = prior_median
              return values[index] > max(reference, prior_median, EPSILON) * (1.0 + TREND_CHANGE_RATIO)


          def _stable_step_platform(values, median):
              if not values or median <= EPSILON:
                  return False
              spread = (max(values) - min(values)) / max(median, EPSILON)
              return spread <= STEP_PLATFORM_VARIATION


          def _step_platform_qualifies(before, after, before_median, after_median):
              if not _stable_step_platform(before, before_median):
                  return False
              if not _stable_step_platform(after, after_median):
                  return False
              edge_ratio = after[0] / max(before[-1], EPSILON)
              return edge_ratio + EPSILON >= 1.0 + STEP_EDGE_CHANGE_RATIO


          def _thread_id(entry, index):
              labels = entry.get("labels", {}) or {}
              for key in ("tid_key", "tid", "thread_id", "pid"):
                  value = str(labels.get(key, "") or "").strip()
                  if value:
                      return value
              legend = str(entry.get("legend", "") or "").strip()
              return legend or f"thread_{index}"


          def _robust_peak(values):
              positive_values = [value for value in values if value > 0]
              if not positive_values:
                  return 0.0, 0.0, 0.0, None
              baseline = _median(positive_values)
              mad = _median([abs(value - baseline) for value in positive_values])
              robust_sigma = 1.4826 * mad
              peak = max(positive_values)
              ratio = peak / max(baseline, EPSILON)
              robust_z = (peak - baseline) / robust_sigma if robust_sigma > EPSILON else None
              return baseline, peak, ratio, robust_z


          def _trend_summary(points):
              if not points:
                  return {
                      "trend": "unknown",
                      "firstTimestamp": None,
                      "lastTimestamp": None,
                      "firstValue": None,
                      "lastValue": None,
                      "firstToLastRatio": None,
                      "baselineMedian": 0.0,
                      "min": None,
                      "max": None,
                      "p95": None,
                      "peakRatio": None,
                      "peakTimestamp": None,
                      "sampleCount": 0,
                  }

              values = [value for _, value in points]
              positive_values = [value for value in values if value > 0]
              baseline = _median(positive_values)
              sample_count = len(values)
              window = max(1, min(TREND_WINDOW_SIZE, sample_count // 2 or 1))
              first_value = _median(values[:window])
              last_value = _median(values[-window:])
              peak_index = max(range(sample_count), key=lambda index: values[index])
              peak = values[peak_index]
              peak_ratio = peak / max(baseline, EPSILON) if baseline > EPSILON else None
              first_last_ratio = last_value / first_value if first_value > EPSILON else None
              positive_fraction = len(positive_values) / sample_count
              positive_run_count = _positive_run_count(values)
              peak_before = _median(values[:peak_index]) if peak_index > 0 else first_value
              peak_after = _median(values[peak_index + 1:]) if peak_index + 1 < sample_count else last_value

              if sample_count < 2:
                  trend = "unknown"
              elif (
                  positive_fraction <= INTERMITTENT_MAX_ACTIVE_FRACTION
                  and positive_run_count >= 2
              ):
                  trend = "intermittent"
              elif (
                  peak_index >= window
                  and peak_index < sample_count - window
                  and peak_ratio is not None
                  and peak_ratio + EPSILON >= POTENTIAL_SPIKE_RATIO
                  and last_value <= peak_before * (1.0 - TREND_CHANGE_RATIO)
              ):
                  trend = "spike_then_fall"
              elif (
                  peak_index >= window
                  and peak_index < sample_count - window
                  and peak_ratio is not None
                  and peak_ratio + EPSILON >= POTENTIAL_SPIKE_RATIO
                  and last_value >= peak_before * (1.0 + TREND_CHANGE_RATIO)
              ):
                  trend = "rise_then_hold"
              elif first_value <= EPSILON and last_value > EPSILON:
                  trend = "rising"
              elif first_value > EPSILON and last_value <= EPSILON:
                  trend = "falling"
              elif first_last_ratio is not None and first_last_ratio >= 1.0 + TREND_CHANGE_RATIO:
                  trend = "rising"
              elif first_last_ratio is not None and first_last_ratio <= 1.0 / (1.0 + TREND_CHANGE_RATIO):
                  trend = "falling"
              else:
                  trend = "stable"

              # 整体中位数被高位平台“抬高”时，单靠首末比会漏掉持续阶跃；这里补充阶跃语义。
              step = _step_change(values)
              if step and step.get("type") == "activation_spike":
                  if trend not in ("intermittent", "falling"):
                      trend = "rising"
              elif step and step.get("ratio") is not None and step["ratio"] + EPSILON >= POTENTIAL_STEP_RATIO:
                  trend = "rise_then_hold"

              return {
                  "trend": trend,
                  "firstTimestamp": points[0][0],
                  "lastTimestamp": points[-1][0],
                  "firstValue": first_value,
                  "lastValue": last_value,
                  "firstToLastRatio": first_last_ratio,
                  "baselineMedian": baseline,
                  "min": min(values),
                  "max": peak,
                  "p95": _percentile(values, SUMMARY_PERCENTILE),
                  "peakRatio": peak_ratio,
                  "peakTimestamp": points[peak_index][0],
                  "sampleCount": sample_count,
                  "positiveFraction": positive_fraction,
                  "positiveRunCount": positive_run_count,
              }


          def _top_anomaly_points(points, baseline, kind="peak", force=False, step=None):
              if not points:
                  return []
              candidates = []
              step_index = step.get("index") if step else None
              step_baseline = step.get("before") if step else None
              for index, (timestamp, value) in enumerate(points):
                  ratio_baseline = (
                      step_baseline
                      if step_index is not None and index >= step_index
                      else baseline
                  )
                  ratio = value / max(ratio_baseline, EPSILON) if ratio_baseline > EPSILON else None
                  is_step_point = step_index is not None and index >= step_index
                  if (
                      force
                      or (is_step_point and ratio_baseline > EPSILON)
                      or (
                          baseline > EPSILON
                          and value >= baseline * (1.0 + TREND_CHANGE_RATIO)
                          and _has_prior_rise([item[1] for item in points], index, baseline)
                      )
                  ):
                      candidates.append({
                          "timestamp": timestamp,
                          "value": value,
                          "ratio": ratio,
                          "kind": kind,
                      })
              candidates.sort(key=lambda item: item["value"], reverse=True)
              return candidates[:MAX_ANOMALY_POINTS]


          def _pattern_for_series(step, spike_indices, sparse_spike, observed_activation):
              if observed_activation:
                  return "activation"
              if step:
                  return "step_up" if step.get("level") == "strong" else "potential_step"
              if sparse_spike:
                  return "sparse"
              if len(spike_indices) == 1:
                  return "isolated_spike"
              if len(spike_indices) > 1:
                  return "repeated_spikes"
              return "steady"


          def _is_statistically_high(value, baseline, robust_z):
              if value <= baseline:
                  return False
              return robust_z is None or robust_z + EPSILON >= SPIKE_Z_THRESHOLD


          def _step_change(values):
              best = None
              for index in range(2, len(values) - 1):
                  before = values[max(0, index - STEP_WINDOW_SIZE):index]
                  after = values[index:min(len(values), index + STEP_WINDOW_SIZE)]
                  if len(before) < 2 or len(after) < 2:
                      continue
                  before_median = _median(before)
                  after_median = _median(after)
                  if before_median <= EPSILON:
                      if (
                          all(value <= EPSILON for value in before[-MIN_STEP_PERSISTENCE_POINTS:])
                          and len(after) >= MIN_STEP_PERSISTENCE_POINTS
                          and all(value > 0 for value in after[:MIN_STEP_PERSISTENCE_POINTS])
                      ):
                          candidate = {
                              "type": "activation_spike",
                              "level": "potential",
                              "index": index,
                              "before": before_median,
                              "after": after_median,
                              "ratio": None,
                              "persistence": sum(1 for value in after if value > 0),
                          }
                      else:
                          continue
                  else:
                      ratio = after_median / before_median
                      if ratio + EPSILON < POTENTIAL_STEP_RATIO:
                          continue
                      # 前后窗口必须是稳定平台，且首个高位点要形成可观测跳变，避免把平滑上升当成阶跃。
                      if (
                          not _step_platform_qualifies(before, after, before_median, after_median)
                          or after[0] < before_median * (1.0 + TREND_CHANGE_RATIO)
                      ):
                          continue
                      persistence = sum(
                          1 for value in after if value >= before_median * STEP_PERSISTENCE_RATIO
                      )
                      if persistence < MIN_STEP_PERSISTENCE_POINTS:
                          continue
                      candidate = {
                          "type": "step_change" if ratio + EPSILON >= STRONG_STEP_RATIO else "potential_step_change",
                          "level": "strong" if ratio + EPSILON >= STRONG_STEP_RATIO else "potential",
                          "index": index,
                          "before": before_median,
                          "after": after_median,
                          "ratio": ratio,
                          "persistence": persistence,
                      }
                  if best is None or candidate["after"] - candidate["before"] > best["after"] - best["before"]:
                      best = candidate
              return best


          def _observed_step(values):
              """返回最接近阶跃阈值的观测值，即使它尚未达到候选门槛。"""
              detected = _step_change(values)
              if detected:
                  return detected.get("ratio") or 1.0, detected.get("type") == "activation_spike"
              best_ratio = 1.0
              activation = False
              for index in range(2, len(values) - 1):
                  before = values[max(0, index - STEP_WINDOW_SIZE):index]
                  after = values[index:min(len(values), index + STEP_WINDOW_SIZE)]
                  if len(before) < 2 or len(after) < 2:
                      continue
                  before_median = _median(before)
                  after_median = _median(after)
                  if before_median <= EPSILON:
                      if (
                          all(value <= EPSILON for value in before[-MIN_STEP_PERSISTENCE_POINTS:])
                          and len(after) >= MIN_STEP_PERSISTENCE_POINTS
                          and all(value > 0 for value in after[:MIN_STEP_PERSISTENCE_POINTS])
                      ):
                          activation = True
                      continue
                  if not _step_platform_qualifies(before, after, before_median, after_median):
                      continue
                  if after[0] < before_median * (1.0 + TREND_CHANGE_RATIO):
                      continue
                  best_ratio = max(best_ratio, after_median / before_median)
              return best_ratio, activation


          def _temporal_score(ratio, robust_z, persistence):
              ratio = ratio or EXTREME_RATIO_THRESHOLD
              robust_z = robust_z or SPIKE_Z_THRESHOLD
              ratio_bonus = min(0.25, max(0.0, ratio - POTENTIAL_SPIKE_RATIO) / 6.0 * 0.25)
              z_bonus = min(0.15, max(0.0, robust_z - SPIKE_Z_THRESHOLD) / 8.0 * 0.15)
              persistence_bonus = min(0.05, max(0, persistence - 1) * 0.025)
              return min(1.0, 0.55 + ratio_bonus + z_bonus + persistence_bonus)


          def _analyze_series(entry, index):
              chart_container = entry.get("chart") or {}
              points = _clean_points(chart_container.get("chartData", {}))
              if len(points) < MIN_SAMPLE_COUNT:
                  return None
              values = [value for _, value in points]
              positive_values = [value for value in values if value > 0]
              if len(positive_values) < MIN_ACTIVE_COUNT:
                  return None

              sparse_spike = len(positive_values) <= 2 and len(positive_values) < len(values)
              baseline = _median(positive_values)
              mad = _median([abs(value - baseline) for value in positive_values])
              robust_sigma = 1.4826 * mad
              spike_indices = []
              max_robust_z = None
              max_ratio = 1.0
              strong_spike = False
              extreme_spike = False

              for point_index, value in enumerate(values):
                  if value <= baseline or value <= 0:
                      continue
                  ratio = value / max(baseline, EPSILON)
                  robust_z = (value - baseline) / robust_sigma if robust_sigma > EPSILON else None
                  if ratio + EPSILON < POTENTIAL_SPIKE_RATIO or not _is_statistically_high(value, baseline, robust_z):
                      continue
                  # 窗口起点没有“突增前”的观测，不能仅凭高位就判为尖峰；窗口末端若有前一段低位仍可保留。
                  if not _has_prior_rise(values, point_index, baseline):
                      continue
                  spike_indices.append(point_index)
                  max_ratio = max(max_ratio, ratio)
                  if robust_z is not None:
                      max_robust_z = robust_z if max_robust_z is None else max(max_robust_z, robust_z)
                  if ratio + EPSILON >= STRONG_SPIKE_RATIO:
                      strong_spike = True
                  if ratio + EPSILON >= EXTREME_RATIO_THRESHOLD and (
                      robust_z is None or robust_z + EPSILON >= EXTREME_Z_THRESHOLD
                  ):
                      extreme_spike = True

              step = _step_change(values)
              observed_step_ratio, observed_activation = _observed_step(values)
              peak_index = max(range(len(values)), key=lambda idx: values[idx])
              peak_ratio = values[peak_index] / max(baseline, EPSILON)
              peak_robust_z = (values[peak_index] - baseline) / robust_sigma if robust_sigma > EPSILON else None
              abnormal_indices = set(spike_indices)
              if step:
                  abnormal_indices.update(range(step["index"], min(len(values), step["index"] + STEP_WINDOW_SIZE)))
              if sparse_spike:
                  abnormal_indices.update(idx for idx, value in enumerate(values) if value > 0)

              top_abnormal = sorted(
                  abnormal_indices,
                  key=lambda idx: values[idx],
                  reverse=True,
              )[:MAX_ANOMALY_POINTS]
              abnormal_points = []
              for idx in top_abnormal:
                  if idx in spike_indices:
                      kind = "spike"
                  elif step and step["index"] <= idx < step["index"] + STEP_WINDOW_SIZE:
                      kind = "step"
                  else:
                      kind = "activity"
                  point_baseline = (
                      step.get("before")
                      if step and idx >= step["index"] and step.get("before", 0) > EPSILON
                      else baseline
                  )
                  abnormal_points.append({
                      "timestamp": points[idx][0],
                      "value": values[idx],
                      "ratio": values[idx] / max(point_baseline, EPSILON) if point_baseline > EPSILON else None,
                      "kind": kind,
                  })
              trend_summary = _trend_summary(points)
              pattern = _pattern_for_series(step, spike_indices, sparse_spike, observed_activation)
              if pattern == "steady":
                  if trend_summary.get("trend") == "rising":
                      pattern = "gradual_rise"
                  elif trend_summary.get("trend") == "falling":
                      pattern = "gradual_fall"
              return {
                  "threadId": _thread_id(entry, index),
                  "labels": entry.get("labels", {}) or {},
                  "chart": {timestamp: value for timestamp, value in points},
                  "sampleCount": len(values),
                  "activePointCount": len(positive_values),
                  "median": baseline,
                  "avg": sum(positive_values) / len(positive_values),
                  "total": sum(values),
                  "peak": values[peak_index],
                  "peakTimestamp": points[peak_index][0],
                  "peakRatio": peak_ratio,
                  "peakRobustZ": peak_robust_z,
                  "maxRobustZ": max_robust_z,
                  "spikeIndices": spike_indices,
                  "strongSpike": strong_spike,
                  "extremeSpike": extreme_spike,
                  "step": step,
                  "stepTimestamp": (
                      points[step["index"]][0]
                      if step and 0 <= step.get("index", -1) < len(points)
                      else None
                  ),
                  "preChangeMedian": step.get("before") if step else None,
                  "postChangeMedian": step.get("after") if step else None,
                  "observedStepRatio": observed_step_ratio,
                  "observedActivation": observed_activation,
                  "sparseSpike": sparse_spike,
                  "trend": trend_summary,
                  "pattern": pattern,
                  "anomalyPointCount": len(abnormal_indices),
                  "abnormalPoints": abnormal_points,
              }


          def _direction_points(analyzed):
              if not analyzed:
                  return [], 0
              totals = {}
              coverage = {}
              for item in analyzed:
                  for timestamp, value in item["chart"].items():
                      totals[timestamp] = totals.get(timestamp, 0.0) + value
                      coverage[timestamp] = coverage.get(timestamp, 0) + 1

              required_coverage = max(1, int(math.ceil(len(analyzed) * DIRECTION_MIN_COVERAGE_RATIO)))
              points = [
                  (
                      timestamp,
                      totals[timestamp],
                      coverage[timestamp],
                  )
                  for timestamp in totals
                  if coverage.get(timestamp, 0) >= required_coverage
              ]
              points.sort(key=lambda item: _timestamp_key(item[0]))
              return points, required_coverage


          def _direction_summary(analyzed):
              if not analyzed:
                  return {
                      "trend": "unknown",
                      "pattern": "insufficient_data",
                      "sampleCount": 0,
                      "activeThreadCount": 0,
                      "coveredPointCount": 0,
                      "anomalyCount": 0,
                      "anomalyPoints": [],
                      "anomalyPointStatus": "reference",
                  }

              points, required_coverage = _direction_points(analyzed)
              simple_points = [(timestamp, value) for timestamp, value, _ in points]
              summary = _trend_summary(simple_points)
              coverage_values = [coverage for _, _, coverage in points]
              summary.update({
                  "activeThreadCount": len(analyzed),
                  "coveredPointCount": len(points),
                  "requiredThreadCoverage": required_coverage,
                  "minThreadCoverage": min(coverage_values) if coverage_values else 0,
                  "maxThreadCoverage": max(coverage_values) if coverage_values else 0,
                  "coverageRatio": (
                      min(coverage_values) / len(analyzed) if coverage_values else 0.0
                  ),
              })
              baseline = summary.get("baselineMedian", 0.0) or 0.0
              values = [value for _, value in simple_points]
              step = _step_change(values) if values else None
              if step:
                  summary.update({
                      "stepRatio": step.get("ratio"),
                      "stepTimestamp": (
                          points[step["index"]][0]
                          if 0 <= step.get("index", -1) < len(points)
                          else None
                      ),
                      "preChangeMedian": step.get("before"),
                      "postChangeMedian": step.get("after"),
                  })
              summary["anomalyPoints"] = _top_anomaly_points(
                  simple_points,
                  baseline,
                  kind="activity" if step and step.get("type") == "activation_spike" else "step" if step else "peak",
                  force=bool(step and step.get("type") == "activation_spike"),
                  step=step,
              )
              summary["anomalyPointStatus"] = "reference"
              if summary["trend"] == "unknown" or len(points) < MIN_SAMPLE_COUNT:
                  summary["pattern"] = "insufficient_data"
              elif step and step.get("type") == "activation_spike":
                  summary["pattern"] = "activation"
              elif step:
                  summary["pattern"] = "step_up"
              elif summary["trend"] == "intermittent":
                  summary["pattern"] = "intermittent"
              elif summary["trend"] == "rising":
                  summary["pattern"] = "gradual_rise"
              elif summary["trend"] == "falling":
                  summary["pattern"] = "gradual_fall"
              elif summary["trend"] == "rise_then_hold":
                  summary["pattern"] = "gradual_rise"
              elif summary["anomalyPoints"]:
                  summary["pattern"] = "isolated_spike" if len(summary["anomalyPoints"]) == 1 else "repeated_spikes"
              else:
                  summary["pattern"] = "steady"
              return summary


          def _direction_aggregate(analyzed):
              if len(analyzed) < DIRECTION_MIN_THREADS:
                  return None, None

              points, required_coverage = _direction_points(analyzed)
              if len(points) < MIN_SAMPLE_COUNT:
                  return None, None

              values = [value for _, value, _ in points]
              aggregate_step = _step_change(values)
              baseline, peak, raw_ratio, robust_z = _robust_peak(values)
              reference_baseline = baseline
              if (
                  aggregate_step
                  and aggregate_step.get("type") != "activation_spike"
                  and aggregate_step.get("before", 0) > EPSILON
              ):
                  # 阶跃场景用变化前平台作为倍率参考，避免高位平台把整窗中位数抬高到峰值。
                  reference_baseline = aggregate_step["before"]
              ratio = (
                  peak / reference_baseline
                  if reference_baseline > EPSILON
                  else None
              )
              peak_index = max(range(len(values)), key=lambda idx: values[idx])
              peak_timestamp = points[peak_index][0]
              peak_coverage = points[peak_index][2]
              statistical_high = peak > baseline and (
                  robust_z is None or robust_z + EPSILON >= DIRECTION_Z_THRESHOLD
              ) and _has_prior_rise(values, peak_index, baseline)

              rising_threads = 0
              covered_threads = 0
              for item in analyzed:
                  if peak_timestamp not in item["chart"]:
                      continue
                  covered_threads += 1
                  own_baseline = item["median"]
                  peak_value = item["chart"][peak_timestamp]
                  if (
                      aggregate_step
                      and aggregate_step.get("type") != "activation_spike"
                      and peak_index > 0
                  ):
                      # 方向值不能代替线程自身平台，改用线程在同一切点前的观测。
                      prior_thread_values = [
                          item["chart"].get(timestamp)
                          for timestamp, _, _ in points[max(0, aggregate_step["index"] - STEP_WINDOW_SIZE):aggregate_step["index"]]
                          if timestamp in item["chart"]
                      ]
                      own_baseline = _median(prior_thread_values)
                  if (
                      own_baseline > EPSILON
                      and peak_value / own_baseline + EPSILON >= DIRECTION_MEMBER_RISE_RATIO
                  ):
                      rising_threads += 1
              rising_fraction = rising_threads / covered_threads if covered_threads else 0.0
              collective_peak = (
                  rising_threads >= DIRECTION_MIN_THREADS
                  and rising_fraction + EPSILON >= DIRECTION_MIN_RISING_FRACTION
              )

              activation_index = aggregate_step.get("index") if aggregate_step else None
              activation_timestamp = None
              activation_threads = 0
              activation_coverage = 0
              activation_fraction = 0.0
              if aggregate_step and aggregate_step.get("type") == "activation_spike":
                  activation_timestamp = points[activation_index][0]
                  activation_coverage = points[activation_index][2]
                  previous_timestamps = [point[0] for point in points[max(0, activation_index - 2):activation_index]]
                  following_timestamps = [
                      point[0]
                      for point in points[
                          activation_index:activation_index + DIRECTION_ACTIVATION_PERSISTENCE
                      ]
                  ]
                  for item in analyzed:
                      chart = item["chart"]
                      if (
                          len(previous_timestamps) >= 2
                          and len(following_timestamps) >= DIRECTION_ACTIVATION_PERSISTENCE
                          and all(
                              timestamp in chart and chart[timestamp] <= EPSILON
                              for timestamp in previous_timestamps
                          )
                          and all(
                              timestamp in chart and chart[timestamp] > 0
                              for timestamp in following_timestamps
                          )
                      ):
                          activation_threads += 1
                  activation_fraction = (
                      activation_threads / activation_coverage if activation_coverage else 0.0
                  )

              aggregate_simple_points = [(timestamp, value) for timestamp, value, _ in points]
              step_thread_count = 0
              step_thread_coverage = 0
              if aggregate_step and aggregate_step.get("type") != "activation_spike":
                  step_index = aggregate_step.get("index", -1)
                  step_timestamp = points[step_index][0] if 0 <= step_index < len(points) else None
                  for item in analyzed:
                      if not step_timestamp or step_timestamp not in item["chart"]:
                          continue
                      step_thread_coverage += 1
                      own_step = item.get("step") or {}
                      if (
                          own_step.get("ratio") is not None
                          and own_step.get("ratio", 0) + EPSILON >= POTENTIAL_STEP_RATIO
                          and abs(own_step.get("index", step_index) - step_index) <= 1
                      ):
                          step_thread_count += 1
              step_thread_fraction = (
                  step_thread_count / step_thread_coverage if step_thread_coverage else 0.0
              )
              collective_step = (
                  aggregate_step is not None
                  and aggregate_step.get("type") != "activation_spike"
                  and ratio is not None
                  and ratio + EPSILON >= DIRECTION_POTENTIAL_RATIO
                  and step_thread_count >= DIRECTION_MIN_THREADS
                  and step_thread_fraction + EPSILON >= DIRECTION_MIN_RISING_FRACTION
              )
              aggregate_trend = _trend_summary(aggregate_simple_points)
              aggregate_anomaly_points = _top_anomaly_points(
                  aggregate_simple_points,
                  baseline,
                  kind=(
                      "collective_activation"
                      if aggregate_step and aggregate_step.get("type") == "activation_spike"
                      else "collective_step"
                      if aggregate_step
                      else "collective_spike"
                  ),
                  force=bool(aggregate_step and aggregate_step.get("type") == "activation_spike"),
                  step=aggregate_step,
              )

              level = None
              signal_type = "collective_spike"
              if (
                  activation_threads >= DIRECTION_MIN_THREADS
                  and activation_fraction + EPSILON >= DIRECTION_MIN_ACTIVATION_FRACTION
              ):
                  signal_type = "collective_activation"
                  level = "potential"
              elif collective_step:
                  signal_type = "collective_step_change"
                  # 阶跃已通过前后平台稳定、持续点和同步线程约束；全窗口稳健Z会被两个平台稀释，不能再作为强阶跃的必要条件。
                  level = (
                      "strong"
                      if ratio + EPSILON >= DIRECTION_STRONG_RATIO
                      and aggregate_step.get("persistence", 0) >= MIN_STEP_PERSISTENCE_POINTS
                      and step_thread_fraction + EPSILON >= DIRECTION_MIN_RISING_FRACTION
                      else "potential"
                  )
              elif (
                  ratio is not None
                  and ratio + EPSILON >= DIRECTION_POTENTIAL_RATIO
                  and statistical_high
                  and collective_peak
              ):
                  strong_z = robust_z is None or robust_z + EPSILON >= DIRECTION_STRONG_Z_THRESHOLD
                  level = (
                      "strong"
                      if ratio + EPSILON >= DIRECTION_STRONG_RATIO and strong_z
                      else "potential"
                  )

              deviation = {
                  "type": signal_type,
                  "median": baseline,
                  "referenceMedian": reference_baseline,
                  "peak": peak,
                  "peakRatio": ratio,
                  "rawPeakRatio": raw_ratio,
                  "robustZ": robust_z,
                  "peakTimestamp": peak_timestamp,
                  "sampleCount": len(values),
                  "requiredThreadCoverage": required_coverage,
                  "peakThreadCoverage": peak_coverage,
                  "peakCoverageRatio": peak_coverage / len(analyzed),
                  "risingThreadCount": rising_threads,
                  "risingThreadFraction": rising_fraction,
                  "activationThreadCount": activation_threads,
                  "activationThreadCoverage": activation_coverage,
                  "activationThreadFraction": activation_fraction,
                  "activationTimestamp": activation_timestamp,
                  "stepRatio": aggregate_step.get("ratio") if aggregate_step else None,
                  "stepTimestamp": (
                      points[aggregate_step["index"]][0]
                      if aggregate_step and 0 <= aggregate_step.get("index", -1) < len(points)
                      else None
                  ),
                  "preChangeMedian": aggregate_step.get("before") if aggregate_step else None,
                  "postChangeMedian": aggregate_step.get("after") if aggregate_step else None,
                  "stepThreadCount": step_thread_count,
                  "stepThreadCoverage": step_thread_coverage,
                  "stepThreadFraction": step_thread_fraction,
                  "trend": aggregate_trend,
                  "pattern": (
                      "collective_activation"
                      if aggregate_step and aggregate_step.get("type") == "activation_spike"
                      else "step_up"
                      if aggregate_step
                      else aggregate_trend.get("trend", "unknown")
                  ),
                  "anomalyCount": len(aggregate_anomaly_points),
                  "anomalyPoints": aggregate_anomaly_points,
              }
              if level is None:
                  return None, deviation

              persistence = aggregate_step.get("persistence", 1) if aggregate_step else 1
              score = _temporal_score(ratio, robust_z, persistence)
              if level == "strong":
                  score = max(STRONG_SCORE_FLOOR, score)
              else:
                  score = min(POTENTIAL_TEMPORAL_SCORE_CEILING, score)
              signal = dict(deviation)
              signal.update({"level": level, "score": round(score, 4)})
              return signal, deviation


          def _deviation_score(item):
              spike_closeness = 0.0
              if item["peak"] > item["median"]:
                  ratio_factor = item["peakRatio"] / POTENTIAL_SPIKE_RATIO
                  if item["peakRobustZ"] is None:
                      z_factor = 1.0
                  else:
                      z_factor = item["peakRobustZ"] / SPIKE_Z_THRESHOLD
                  spike_closeness = min(ratio_factor, z_factor)
              step_closeness = 0.0
              if item["observedStepRatio"] > 1.0:
                  step_closeness = (
                      (item["observedStepRatio"] - 1.0)
                      / max(POTENTIAL_STEP_RATIO - 1.0, EPSILON)
                  )
              activation_closeness = 0.95 if item["observedActivation"] else 0.0
              return max(0.0, min(1.0, max(spike_closeness, step_closeness, activation_closeness)))


          def analyze_data(result_str):
              try:
                  data = json.loads(result_str or "{}")
              except (TypeError, ValueError, json.JSONDecodeError):
                  data = {}
              timeseries = data.get("data", {}).get("timeseries", []) or []
              unit = data.get("unit", "") or ""
              analyzed = []
              all_positive_values = []

              for index, entry in enumerate(timeseries, start=1):
                  if not isinstance(entry, dict):
                      continue
                  series = _analyze_series(entry, index)
                  if series is None:
                      continue
                  analyzed.append(series)
                  all_positive_values.extend(value for value in series["chart"].values() if value > 0)

              direction_signal, direction_deviation = _direction_aggregate(analyzed)
              direction_summary = _direction_summary(analyzed)
              direction_signals = [direction_signal] if direction_signal else []
              if direction_signal:
                  direction_summary["pattern"] = direction_signal.get("type", direction_summary.get("pattern"))
                  direction_summary["anomalyPointStatus"] = "threshold"
              for signal in direction_signals:
                  signal["trend"] = direction_summary.get("trend", "unknown")
                  signal["pattern"] = direction_summary["pattern"]
                  signal["anomalyPoints"] = direction_summary.get("anomalyPoints", [])
              if direction_deviation:
                  direction_deviation["trend"] = direction_summary.get("trend", "unknown")
                  direction_deviation["pattern"] = direction_summary.get("pattern", "unknown")
                  direction_deviation["anomalyPoints"] = direction_summary.get("anomalyPoints", [])
              direction_total = sum(item["total"] for item in analyzed)
              magnitude_floor = _percentile(all_positive_values, MAGNITUDE_PERCENTILE)
              direction_value_median = _percentile(all_positive_values, 0.50)
              direction_value_high = _percentile(all_positive_values, ACTIVATION_OUTLIER_PERCENTILE)
              candidates = []
              deviations = []

              for item in analyzed:
                  contribution = item["total"] / direction_total if direction_total > 0 else 0.0
                  other_totals = [peer["total"] for peer in analyzed if peer is not item and peer["total"] > 0]
                  peer_reference = _median(other_totals)
                  peer_ratio = item["total"] / max(peer_reference, EPSILON) if peer_reference > 0 else 1.0
                  deviations.append({
                      "threadId": item["threadId"],
                      "score": round(_deviation_score(item), 4),
                      "median": item["median"],
                      "peak": item["peak"],
                      "peakRatio": item["peakRatio"],
                      "stepRatio": item["observedStepRatio"],
                      "robustZ": item["peakRobustZ"],
                      "contribution": contribution,
                      "unit": unit,
                      "trend": item["trend"],
                      "pattern": item["pattern"],
                      "abnormalPoints": item["abnormalPoints"],
                  })

                  magnitude_ok = item["peak"] >= magnitude_floor or contribution >= MIN_DIRECTION_CONTRIBUTION or item["extremeSpike"]
                  anomaly_types = []
                  scores = []

                  if item["spikeIndices"] and magnitude_ok:
                      if item["extremeSpike"]:
                          anomaly_types.append("extreme_spike")
                      elif item["strongSpike"]:
                          anomaly_types.append("spike")
                      else:
                          anomaly_types.append("potential_spike")
                      spike_score = _temporal_score(item["peakRatio"], item["maxRobustZ"], len(item["spikeIndices"]))
                      if item["extremeSpike"]:
                          spike_score = max(EXTREME_SCORE_FLOOR, spike_score)
                      elif item["strongSpike"]:
                          spike_score = max(STRONG_SCORE_FLOOR, spike_score)
                      else:
                          spike_score = min(POTENTIAL_TEMPORAL_SCORE_CEILING, spike_score)
                      scores.append(spike_score)

                  activation_outlier = item["peak"] > max(direction_value_high, direction_value_median * ACTIVATION_MEDIAN_RATIO)
                  activation_dominant = len(analyzed) == 1 or (
                      contribution >= ACTIVATION_DOMINANT_CONTRIBUTION
                      and peer_ratio >= ACTIVATION_DOMINANT_PEER_RATIO
                  )
                  step = item["step"]
                  if step:
                      activation_ok = step["type"] != "activation_spike" or activation_outlier or activation_dominant
                      if magnitude_ok and activation_ok:
                          anomaly_types.append(step["type"])
                          step_score = _temporal_score(step.get("ratio"), item["maxRobustZ"], step["persistence"])
                          if step.get("level") == "strong":
                              step_score = max(STRONG_SCORE_FLOOR, step_score)
                          else:
                              step_score = min(POTENTIAL_TEMPORAL_SCORE_CEILING, step_score)
                          scores.append(step_score)

                  if item["sparseSpike"]:
                      sparse_spike_ok = activation_outlier or activation_dominant
                      if sparse_spike_ok:
                          anomaly_types.append("sparse_spike")
                          scores.append(min(
                              POTENTIAL_TEMPORAL_SCORE_CEILING,
                              _temporal_score(None, None, item["activePointCount"]),
                          ))

                  is_small_pool_heavy = len(analyzed) == 2 and (
                      contribution >= SMALL_POOL_HEAVY_CONTRIBUTION
                      and peer_ratio >= SMALL_POOL_HEAVY_PEER_RATIO
                  )
                  is_general_heavy = len(analyzed) >= 3 and (
                      contribution >= GENERAL_HEAVY_CONTRIBUTION
                      and peer_ratio >= GENERAL_HEAVY_PEER_RATIO
                  )
                  if is_small_pool_heavy or is_general_heavy:
                      anomaly_types.append("heavy_consumer")
                      scores.append(min(1.0, 0.55 + min(0.30, contribution) + min(
                          0.15,
                          max(0.0, peer_ratio - GENERAL_HEAVY_PEER_RATIO) / 3.0 * 0.15,
                      )))

                  if len(analyzed) >= 3 and peer_ratio >= PEER_OUTLIER_RATIO:
                      anomaly_types.append("peer_outlier")
                      scores.append(min(1.0, 0.55 + min(
                          0.45,
                          max(0.0, peer_ratio - PEER_OUTLIER_RATIO) / 5.0 * 0.45,
                      )))

                  if not anomaly_types:
                      continue

                  candidates.append({
                      "threadId": item["threadId"],
                      "labels": item["labels"],
                      "chart": item["chart"],
                      "anomalyTypes": anomaly_types,
                      "score": round(max(scores), 4),
                      "sampleCount": item["sampleCount"],
                      "activePointCount": item["activePointCount"],
                      "abnormalCount": item["anomalyPointCount"],
                      "median": item["median"],
                      "avg": item["avg"],
                      "peak": item["peak"],
                      "peakTimestamp": item["peakTimestamp"],
                      "peakRatio": item["peakRatio"],
                      "maxRobustZ": item["peakRobustZ"],
                      "stepRatio": step.get("ratio") if step else None,
                      "stepTimestamp": item.get("stepTimestamp"),
                      "preChangeMedian": item.get("preChangeMedian"),
                      "postChangeMedian": item.get("postChangeMedian"),
                      "contribution": contribution,
                      "peerRatio": peer_ratio,
                      "abnormalPoints": item["abnormalPoints"],
                      "trend": item["trend"],
                      "pattern": item["pattern"],
                      "unit": unit,
                  })

              candidates.sort(key=lambda item: (-item["score"], -item["contribution"], -item["peak"]))
              candidate_contribution = min(1.0, sum(item["contribution"] for item in candidates))
              limited = candidates[:MAX_CANDIDATES]
              top_deviations = []
              if not candidates and not direction_signals:
                  deviations = [item for item in deviations if item["score"] > 0]
                  deviations.sort(key=lambda item: (-item["score"], -item["peakRatio"], -item["contribution"]))
                  top_deviations = deviations[:MAX_FALLBACK_DEVIATIONS]

              return json.dumps({
                  "schemaVersion": "thread-window-anomaly-v4",
                  "unit": unit,
                  "seriesCount": len(timeseries),
                  "activeThreadCount": len(analyzed),
                  "candidateCount": len(candidates),
                  "candidateContribution": candidate_contribution,
                  "truncatedCandidateCount": max(0, len(candidates) - len(limited)),
                  "directionTotal": direction_total,
                  "directionSummary": direction_summary,
                  "directionSignals": direction_signals,
                  "directionDeviation": direction_deviation,
                  "topDeviations": top_deviations,
                  "candidates": limited,
              }, ensure_ascii=False)



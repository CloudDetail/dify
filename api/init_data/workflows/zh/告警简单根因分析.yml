    - data:
        code: "import json\n\n\ndef _loads(value, default):\n    if isinstance(value,\
          \ (list, dict)):\n        return value\n    try:\n        return json.loads(value)\n\
          \    except (TypeError, json.JSONDecodeError):\n        return default\n\
          \n\ndef _statement_summary(value):\n    text = str(value or \"\").strip()\n\
          \    return text if len(text) <= 240 else text[:237] + \"...\"\n\n\ndef\
          \ _span_items(span_data):\n    payload = _loads(span_data, {})\n    data\
          \ = payload.get(\"data\", {}) if isinstance(payload, dict) else {}\n   \
          \ if isinstance(data, dict):\n        items = data.get(\"data\", [])\n \
          \   else:\n        items = []\n    return items if isinstance(items, list)\
          \ else []\n\n\ndef main(rtt_instances, span_data):\n    rtt = _loads(rtt_instances,\
          \ [])\n    if not isinstance(rtt, list):\n        rtt = []\n    dependencies\
          \ = []\n    for span in _span_items(span_data):\n        if not isinstance(span,\
          \ dict):\n            continue\n        attributes = span.get(\"attributes\"\
          , {}) or {}\n        dependencies.append({\n            \"service\": span.get(\"\
          peerService\") or span.get(\"serviceName\") or attributes.get(\"peer.service\"\
          ) or \"\",\n            \"instance\": span.get(\"instance\") or attributes.get(\"\
          server.address\") or attributes.get(\"net.peer.name\") or \"\",\n      \
          \      \"operation\": span.get(\"name\", \"\"),\n            \"db_system\"\
          : attributes.get(\"db.system\", \"\"),\n            \"statement\": _statement_summary(attributes.get(\"\
          db.statement\", \"\")),\n            \"duration\": span.get(\"duration\"\
          , 0),\n            \"error\": bool(span.get(\"error\") or span.get(\"isError\"\
          ) or span.get(\"status\") == \"error\"),\n            \"trace_id\": span.get(\"\
          traceId\", \"\"),\n            \"span_id\": span.get(\"spanId\", \"\"),\n\
          \        })\n\n    if rtt and dependencies:\n        status = \"complete\"\
          \n    elif rtt or dependencies:\n        status = \"partial\"\n    else:\n\
          \        status = \"empty\"\n    return {\n        \"result\": json.dumps({\n\
          \            \"rtt_instances\": rtt,\n            \"span_dependencies\"\
          : dependencies,\n            \"evidence_status\": status,\n        })\n\
          \    }\n"
        code_language: python3

    - data:
        code: "import json\ndef get_value(data, keys):\n    for key in keys:\n        value = data.get(key)\n        if value is not None:\n            return value\n    return \"\"\n\n\ndef main(arg: str, node: str, startTime: int, endTime: int) -> dict:\n    data = json.loads(arg)\n\n    SECOND = 1000000  # microseconds\n    MINUTE = 60 * SECOND\n    HOUR = 60 * MINUTE\n    if node:\n        node = get_value(data, [\"node\", \"nodeName\", \"node_name\"])\n    return {\n        \"tenantId\": get_tenant_id(data),\n        \"alertName\": get_value(data, [\"alertName\", \"alertname\"]),\n        \"service\": get_value(data, [\"svc_name\", \"service\"]),\n        \"endpoint\": get_value(data, [\"endpoint\", \"content_key\"]),\n        \"pod\": get_value(data, [\"pod\", \"src_pod\", \"pod_name\"]),\n        \"namespace\": get_value(data, [\"namespace\", \"src_namespace\"]),\n        \"pid\": get_value(data, [\"pid\"]),\n        \"node\": node,\n        \"containerId\": get_value(data, [\"containerId\", \"container_id\"]),\n        \"alertEventId\": get_value(data, [\"alertEventId\"]),\n        \"historyStartTime\": startTime - (24*HOUR),\n        \"historyEndTime\": startTime,\n    }\n\n\ndef get_tenant_id(data):\n    # 事件顶层身份优先，兼容原始标签；不能使用 providerId/groupId 代替租户。\n    if not isinstance(data, dict):\n        return \"\"\n    sources = [data] + [data.get(key) for key in (\"raw_tags\", \"tags\", \"labels\")]\n    for source in sources:\n        if not isinstance(source, dict):\n            continue\n        for key in (\"tenantId\", \"tenant_id\"):\n            value = source.get(key)\n            if isinstance(value, str) and value.strip():\n                return value.strip()\n            if isinstance(value, int) and not isinstance(value, bool):\n                return str(value)\n    return \"\"\n"

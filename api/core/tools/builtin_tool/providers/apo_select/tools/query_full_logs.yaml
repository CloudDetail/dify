identity:
  name: 查询全量日志
  author: APO
  label:
    en_US: Query all logs.
    zh_Hans: 查询全量日志
description:
  human:
    en_US: Query logs through Dataplane providers.
    zh_Hans: 通过 Dataplane 数据源查询日志
  llm: Query logs through Dataplane providers.
display:
  type: log
  title: log
  unit: log
parameters:
  - name: query
    type: string
    required: false
    label:
      en_US: Compatible log equality filters
      zh_Hans: 兼容的日志等值过滤条件
    human_description:
      en_US: Legacy equality-only raw_logs condition, combined with AND/OR.
      zh_Hans: 兼容现有工作流的 raw_logs 等值条件，支持 AND/OR 组合
    llm_description: Legacy equality-only raw_logs condition. Supported fields map to Dataplane log filters.
    form: llm

  - name: pageNum
    type: number
    required: true
    label: 
      en_US: Current page
      zh_Hans: 当前页
    human_description:
      en_US: Current page
      zh_Hans: 当前页
    llm_description: Current page
    form: llm

  - name: pageSize
    type: number
    required: true
    label: 
      en_US: Page size
      zh_Hans: 页大小
    human_description:
      en_US: Page size
      zh_Hans: 页大小
    llm_description: Page size
    form: llm

  - name: startTime
    type: number
    required: true
    label:
      en_US: Start Time
      zh_Hans: 开始时间
    human_description:
      en_US: Start timestamp in microseconds
      zh_Hans: 查询开始时间（微秒）
    llm_description: Microsecond timestamp for start time
    form: llm

  - name: endTime
    type: number
    required: true
    label:
      en_US: End Time
      zh_Hans: 结束时间
    human_description:
      en_US: End timestamp in microseconds
      zh_Hans: 查询结束时间（微秒）
    llm_description: Microsecond timestamp for end time
    form: llm

identity:
  name: dataplane_service_redcharts
  author: APO
  label:
    en_US: Query service's RED charts
    zh_Hans: 查询服务RED指标
description:
  human:
    en_US: Query service's RED charts
    zh_Hans: 查询服务RED指标
  llm: 查询服务RED曲线。COS返回cpm（次/分钟）、errorRate（0..1）、avgDurationMs（毫秒），不是请求总数；使用完整服务名。endpoint为空或.*时查询服务汇总，指定端点时必须精确匹配。
display:
  type: metric
  title: Service RED charts
  unit: number
parameters:
  - name: tenantId
    type: string
    required: false
    label:
      en_US: Tenant ID
      zh_Hans: 租户ID
    human_description:
      en_US: Required for dataplane; bind the tenant from the alert or session context.
      zh_Hans: dataplane查询必填，绑定告警事件或会话的tenantId，不能由模型猜测。
    llm_description: Use the exact tenantId supplied by the alert or session. Never infer a tenant or use a data group ID.
    form: llm
  - name: service
    type: string
    required: false
    label:
      en_US: service
      zh_Hans: service
    human_description:
      en_US: Service name
      zh_Hans: 服务名
    llm_description: Service name
    form: llm
  - name: cluster
    type: string
    required: false
    label:
      en_US: cluster
      zh_Hans: cluster
    human_description:
      en_US: cluster
      zh_Hans: 集群
    llm_description: cluster
    form: llm
  - name: endpoint
    type: string
    required: false
    label:
      en_US: endpoint
      zh_Hans: endpoint
    human_description:
      en_US: endpoint
      zh_Hans: endpoint
    llm_description: endpoint
    form: llm
  - name: startTime
    type: number
    required: true
    label:
      en_US: startTime
      zh_Hans: startTime
    human_description:
      en_US: Data query start time(Microsecond)
      zh_Hans: 开始时间 (微秒)
    llm_description: Data query start time(Microsecond)
    form: llm
  - name: endTime
    type: number
    required: true
    label:
      en_US: endTime
      zh_Hans: endTime
    human_description:
      en_US: Data query end time(Microsecond)
      zh_Hans: 结束时间 (微秒)
    llm_description: Data query end time(Microsecond)
    form: llm